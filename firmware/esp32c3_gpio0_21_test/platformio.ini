[env:esp32c3_gpio0_21_test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = COM5
upload_speed = 115200
monitor_port = COM5
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3_gpio0_21_test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -D AILANDLINE_DEFAULT_HOOK_PIN=4
  -D AILANDLINE_DEFAULT_BUZZER_PIN=2
  -D AILANDLINE_DEFAULT_LED_PIN=1
