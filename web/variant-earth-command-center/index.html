<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>服务通信中枢</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #020403;
      --ink: #f7f3e8;
      --muted: rgba(247, 243, 232, 0.66);
      --dim: rgba(247, 243, 232, 0.22);
      --red: #e6423e;
      --red-soft: rgba(230, 66, 62, 0.13);
      --red-line: rgba(230, 66, 62, 0.42);
      --cyan: #7df6e3;
      --cyan-soft: rgba(125, 246, 227, 0.16);
      --cyan-line: rgba(125, 246, 227, 0.48);
      --paper: #f1eddf;
      --surface: rgba(8, 24, 22, 0.78);
      --black-72: rgba(6, 17, 15, 0.72);
      --black-86: rgba(6, 17, 15, 0.86);
      --glass: linear-gradient(145deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.055));
      --glass-strong: linear-gradient(145deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.08));
      --glass-stroke: rgba(255, 255, 255, 0.2);
      --glass-shadow: 0 26px 72px rgba(0, 0, 0, 0.34);
      --ui: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --mono: "JetBrains Mono", "Courier New", monospace;
      --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    body[data-palette="blue"] {
      --bg: #050b17;
      --cyan: #89c7ff;
      --cyan-soft: rgba(137, 199, 255, 0.13);
      --cyan-line: rgba(137, 199, 255, 0.42);
      --red: #ffb86d;
      --red-soft: rgba(255, 184, 109, 0.12);
      --red-line: rgba(255, 184, 109, 0.36);
      --surface: rgba(7, 17, 34, 0.9);
      --black-72: rgba(5, 11, 23, 0.72);
      --black-86: rgba(5, 11, 23, 0.88);
    }

    body[data-palette="amber"] {
      --bg: #120b05;
      --cyan: #ffbf68;
      --cyan-soft: rgba(255, 191, 104, 0.13);
      --cyan-line: rgba(255, 191, 104, 0.42);
      --red: #7df6e3;
      --red-soft: rgba(125, 246, 227, 0.1);
      --red-line: rgba(125, 246, 227, 0.34);
      --surface: rgba(28, 16, 8, 0.9);
      --black-72: rgba(18, 11, 5, 0.72);
      --black-86: rgba(18, 11, 5, 0.88);
    }

    body[data-palette="red"] {
      --bg: #120305;
      --cyan: #ff5151;
      --cyan-soft: rgba(255, 81, 81, 0.13);
      --cyan-line: rgba(255, 81, 81, 0.44);
      --red: #ffd06f;
      --red-soft: rgba(255, 208, 111, 0.1);
      --red-line: rgba(255, 208, 111, 0.34);
      --surface: rgba(30, 5, 8, 0.9);
      --black-72: rgba(18, 3, 5, 0.72);
      --black-86: rgba(18, 3, 5, 0.88);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-width: 320px;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--ui);
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #020403;
      isolation: isolate;
      cursor: grab;
      touch-action: none;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 6;
      opacity: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 42% 48%, rgba(247, 243, 232, 0.02), transparent 18%),
        radial-gradient(circle at 42% 48%, transparent 0 28%, rgba(2, 4, 3, 0.58) 68%, rgba(2, 4, 3, 0.96) 100%);
      backdrop-filter: blur(0) saturate(1);
      -webkit-backdrop-filter: blur(0) saturate(1);
      transition: opacity 420ms ease, backdrop-filter 420ms ease, -webkit-backdrop-filter 420ms ease;
    }

    .stage[data-dragging="true"] {
      cursor: grabbing;
    }

    .stage[data-mode="map"] {
      cursor: default;
      touch-action: auto;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      display: none;
      background:
        linear-gradient(180deg, rgba(125, 246, 227, 0.07), transparent 20%, transparent 80%, rgba(230, 66, 62, 0.08)),
        repeating-linear-gradient(180deg, transparent 0, transparent 3px, rgba(255, 255, 255, 0.025) 4px);
      mix-blend-mode: screen;
      opacity: 0.42;
    }

    #globe-canvas,
    #map,
    #map-label-layer,
    #text-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #map {
      z-index: 0;
      opacity: 1;
      visibility: visible;
      background: #020403;
      transform: scale(1.018);
      transform-origin: center;
      transition: opacity 820ms ease, visibility 820ms ease, filter 820ms ease, transform 820ms ease;
    }

    body[data-view-mode="globe"] #map {
      opacity: 0;
      visibility: hidden;
    }

    .stage[data-mode="map"] #map {
      opacity: 1;
      visibility: visible;
      filter: saturate(0.78) contrast(0.92) brightness(0.86);
      transform: scale(1);
    }

    #map.is-visible {
      opacity: 1;
      visibility: visible;
      filter: saturate(0.78) contrast(0.92) brightness(0.86);
      transform: scale(1);
    }

    body[data-handoff="map"] .stage[data-mode="map"] #map {
      opacity: 0.82;
      filter: saturate(0.72) contrast(0.88) brightness(0.78);
    }

    body[data-handoff="map"] #map.is-visible {
      opacity: 0.82;
      filter: saturate(0.72) contrast(0.88) brightness(0.78);
    }

    .maplibregl-canvas {
      outline: 0;
    }

    .maplibregl-ctrl-bottom-left,
    .maplibregl-ctrl-bottom-right {
      display: none;
    }

    .maplibregl-ctrl-top-right {
      top: 94px;
      right: 16px;
    }

    .maplibregl-ctrl-group {
      overflow: hidden;
      border: 1px solid var(--glass-stroke);
      border-radius: 20px;
      background: var(--glass);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(24px) saturate(1.32);
      -webkit-backdrop-filter: blur(24px) saturate(1.32);
    }

    .maplibregl-ctrl button {
      width: 36px;
      height: 36px;
      border: 0;
      filter: invert(1) opacity(0.86);
    }

    .maplibregl-ctrl-group button + button {
      border-top: 0;
    }

    .maplibregl-ctrl button:not(:disabled):hover {
      background: rgba(255, 255, 255, 0.16);
    }

    #map-label-layer {
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 520ms ease, visibility 520ms ease;
    }

    body[data-view-mode="map"] #map-label-layer {
      opacity: 1;
      visibility: visible;
    }

    .map-city-label {
      position: absolute;
      display: grid;
      gap: 3px;
      min-width: 78px;
      padding: 7px 9px 7px 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(8, 12, 11, 0.62), rgba(8, 12, 11, 0.28));
      color: rgba(247, 243, 232, 0.92);
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px) saturate(1.25);
      -webkit-backdrop-filter: blur(18px) saturate(1.25);
      transform: translate(-50%, -100%);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.72);
    }

    .map-city-label::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(247, 243, 232, 0.9);
      box-shadow: 0 0 0 5px rgba(247, 243, 232, 0.08), 0 0 18px rgba(125, 246, 227, 0.34);
      transform: translateX(-50%);
    }

    .map-city-label strong {
      font-size: 13px;
      line-height: 1;
      font-weight: 760;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .map-city-label span {
      color: rgba(247, 243, 232, 0.58);
      font-size: 10px;
      line-height: 1;
      font-weight: 560;
      white-space: nowrap;
    }

    .map-city-label.is-focus {
      border-color: rgba(125, 246, 227, 0.38);
      background: linear-gradient(145deg, rgba(26, 52, 46, 0.72), rgba(8, 12, 11, 0.34));
    }

    .map-city-label.is-floating {
      left: 18px;
      top: 112px;
      min-width: 112px;
      transform: none;
    }

    .map-city-label.is-floating::after {
      display: none;
    }

    #text-canvas {
      pointer-events: none;
      z-index: 2;
      mix-blend-mode: screen;
    }

    #globe-canvas,
    #text-canvas,
    .topbar,
    .right-stack,
    .bottom-ticker,
    .mobile-dock {
      transition: opacity 420ms ease, filter 420ms ease, transform 420ms ease;
    }

    body[data-handoff="map"] .stage::before {
      opacity: 1;
      backdrop-filter: blur(10px) saturate(1.05);
      -webkit-backdrop-filter: blur(10px) saturate(1.05);
    }

    body[data-handoff="map"] #globe-canvas,
    body[data-handoff="map"] #text-canvas {
      opacity: 0.82;
      filter: blur(0) saturate(0.92);
      transform: scale(1.065);
    }

    body[data-view-mode="map"] #globe-canvas,
    body[data-view-mode="map"] #text-canvas {
      opacity: 0;
      visibility: hidden;
    }

    body[data-view-mode="map"][data-handoff="map"] #globe-canvas {
      opacity: 0.36;
      visibility: visible;
      filter: blur(2px) saturate(0.82) brightness(0.72);
      transform: scale(1.095);
    }

    body[data-view-mode="map"][data-handoff="map"] #text-canvas {
      opacity: 0.18;
      visibility: visible;
      filter: blur(1px);
      transform: scale(1.08);
    }

    body[data-view-mode="map"] .right-stack {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    body[data-handoff="map"] .topbar,
    body[data-handoff="map"] .right-stack,
    body[data-handoff="map"] .bottom-ticker,
    body[data-handoff="map"] .mobile-dock {
      opacity: 0;
      filter: blur(6px);
      transform: translateY(8px);
    }

    .stage[data-handoff="map"] {
      cursor: progress;
    }

    .scanline {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 2px;
      z-index: 5;
      background: rgba(125, 246, 227, 0.34);
      box-shadow: 0 0 18px rgba(125, 246, 227, 0.22);
      animation: scan 5.5s linear infinite;
      pointer-events: none;
    }

    @keyframes scan {
      from { transform: translateY(-3vh); }
      to { transform: translateY(103vh); }
    }

    .topbar {
      position: absolute;
      z-index: 7;
      top: 16px;
      left: 16px;
      right: 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 14px;
      pointer-events: none;
    }

    .brand-block {
      pointer-events: auto;
      width: min(620px, 100%);
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 0;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(29px, 3vw, 54px);
      line-height: 0.9;
      font-weight: 900;
      text-transform: none;
      letter-spacing: 0;
      overflow-wrap: anywhere;
      text-shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
    }

    .clock-block {
      pointer-events: auto;
      min-width: 220px;
      border: 0;
      background: transparent;
      color: var(--ink);
      padding: 0;
      text-align: right;
      text-shadow: 0 10px 28px rgba(0, 0, 0, 0.72), 0 0 18px rgba(125, 246, 227, 0.16);
    }

    .clock-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: none;
    }

    .clock-time {
      margin-top: 2px;
      font-family: var(--display);
      font-size: 29px;
      line-height: 0.9;
      font-weight: 900;
    }

    .right-stack {
      position: absolute;
      z-index: 7;
      right: 16px;
      top: 158px;
      bottom: 80px;
      width: clamp(250px, 22vw, 352px);
      display: grid;
      grid-template-rows: repeat(3, minmax(104px, 1fr));
      gap: 10px;
      border: 0;
      pointer-events: auto;
    }

    .status-block {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 0;
      padding: 18px;
      border: 1px solid var(--glass-stroke);
      border-radius: 28px;
      background: var(--glass);
      color: rgba(247, 243, 232, 0.94);
      box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.18), inset 0 -1px 0 rgba(255, 255, 255, 0.055);
      backdrop-filter: blur(28px) saturate(1.35);
      -webkit-backdrop-filter: blur(28px) saturate(1.35);
    }

    .status-block:nth-child(2) {
      background: linear-gradient(145deg, rgba(125, 246, 227, 0.16), rgba(255, 255, 255, 0.055));
    }

    .status-block:last-child {
      background: linear-gradient(145deg, rgba(247, 243, 232, 0.18), rgba(255, 255, 255, 0.055));
    }

    .status-block::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 18% 0%, rgba(255, 255, 255, 0.18), transparent 34%);
      opacity: 0.8;
      pointer-events: none;
    }

    .status-label {
      position: relative;
      z-index: 1;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 700;
      text-transform: none;
      color: rgba(247, 243, 232, 0.72);
    }

    .status-huge {
      position: relative;
      z-index: 1;
      font-family: var(--display);
      font-size: clamp(48px, 7vw, 92px);
      line-height: 0.82;
      font-weight: 850;
      text-transform: none;
      letter-spacing: 0;
      overflow-wrap: anywhere;
      text-shadow: 0 14px 38px rgba(0, 0, 0, 0.38);
    }

    #sector-word {
      font-size: clamp(30px, 3.15vw, 46px);
      line-height: 0.96;
    }

    .status-value {
      position: relative;
      z-index: 1;
      font-size: 19px;
      line-height: 1.25;
      font-weight: 720;
      text-transform: none;
      color: rgba(247, 243, 232, 0.88);
    }

    .bottom-ticker {
      position: absolute;
      z-index: 7;
      left: 16px;
      right: 16px;
      bottom: 16px;
      height: 52px;
      display: flex;
      align-items: center;
      overflow: hidden;
      border: 1px solid var(--glass-stroke);
      border-radius: 26px;
      background: var(--glass);
      color: #f7f3e8;
      pointer-events: auto;
      box-shadow: 0 -18px 50px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(28px) saturate(1.35);
      -webkit-backdrop-filter: blur(28px) saturate(1.35);
    }

    .bottom-ticker::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), transparent 42%);
      opacity: 0.65;
      pointer-events: none;
    }

    .ticker-label {
      position: relative;
      z-index: 1;
      align-self: stretch;
      display: flex;
      align-items: center;
      gap: 9px;
      width: 138px;
      flex: 0 0 138px;
      margin-left: 7px;
      padding: 0 15px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(247, 243, 232, 0.92);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: none;
      text-shadow: 0 8px 22px rgba(0, 0, 0, 0.56);
    }

    .ticker-label::before {
      content: "";
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: rgba(247, 243, 232, 0.88);
      box-shadow: 0 0 0 5px rgba(247, 243, 232, 0.08), 0 0 18px rgba(125, 246, 227, 0.45);
      animation: tickerPulse 1.9s ease-in-out infinite;
    }

    .ticker-window {
      position: relative;
      z-index: 1;
      overflow: hidden;
      min-width: 0;
      height: 100%;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      white-space: nowrap;
      background: transparent;
      border-left: 8px solid transparent;
    }

    .ticker-window::before,
    .ticker-window::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      z-index: 2;
      width: 64px;
      pointer-events: none;
    }

    .ticker-window::before {
      left: 0;
      background: linear-gradient(90deg, rgba(8, 16, 15, 0.92) 0%, transparent 100%);
    }

    .ticker-window::after {
      right: 0;
      background: linear-gradient(270deg, rgba(8, 16, 15, 0.92) 0%, transparent 100%);
    }

    .ticker-track {
      display: inline-block;
      padding-left: 18px;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0;
      text-transform: none;
      animation: ticker 42s linear infinite;
      color: rgba(247, 243, 232, 0.76);
      text-shadow: 0 8px 24px rgba(0, 0, 0, 0.68);
    }

    @keyframes ticker {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @keyframes tickerPulse {
      0%,
      100% {
        transform: scale(0.86);
        opacity: 0.72;
      }

      50% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .mobile-dock {
      display: none;
    }

    @media (max-width: 1100px) {
      .right-stack {
        width: 270px;
      }

    }

    @media (max-width: 860px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .clock-block {
        display: none;
      }

      .right-stack {
        display: none;
      }

      .bottom-ticker {
        left: 12px;
        right: 12px;
        bottom: 12px;
      }

      .ticker-label {
        width: 124px;
        flex-basis: 124px;
      }
    }

    @media (max-width: 560px) {
      .brand-block {
        padding: 10px;
      }

      .mobile-dock {
        position: absolute;
        z-index: 7;
        left: 12px;
        right: auto;
        bottom: 70px;
        width: min(366px, calc(100vw - 24px));
        max-width: min(366px, calc(100vw - 24px));
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        padding: 8px;
        border: 1px solid var(--glass-stroke);
        border-radius: 24px;
        background: var(--glass);
        box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(28px) saturate(1.35);
        -webkit-backdrop-filter: blur(28px) saturate(1.35);
        pointer-events: auto;
      }

      .mobile-dock button {
        min-width: 0;
        width: 100%;
        height: 38px;
        padding: 0 4px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(247, 243, 232, 0.86);
        font-size: 11px;
        font-weight: 700;
        text-transform: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mobile-dock a {
        min-width: 0;
        width: 100%;
        height: 38px;
        display: grid;
        place-items: center;
        padding: 0 4px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(247, 243, 232, 0.86);
        font-size: 11px;
        font-weight: 700;
        text-decoration: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mobile-dock button[aria-pressed="true"] {
        border-color: rgba(125, 246, 227, 0.34);
        background: rgba(125, 246, 227, 0.2);
        color: rgba(247, 243, 232, 0.98);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .scanline,
      .ticker-track {
        animation: none;
      }
    }
  </style>
</head>
<body data-palette="teal">
  <main class="stage" id="stage" aria-label="服务通信中枢">
    <div id="map" aria-label="真实地图"></div>
    <div id="map-label-layer" aria-hidden="true"></div>
    <canvas id="globe-canvas"></canvas>
    <canvas id="text-canvas"></canvas>

    <header class="topbar">
      <section class="brand-block" aria-label="系统身份">
        <div class="brand-row">
          <h1>服务通信中枢</h1>
        </div>
      </section>

      <section class="clock-block" aria-label="本地时间">
        <div class="clock-label">本地时间</div>
        <div class="clock-time" id="clock">00:00:00</div>
      </section>
    </header>

    <section class="right-stack" aria-label="服务状态面板">
      <article class="status-block">
        <div class="status-label">系统状态</div>
        <div class="status-huge" id="status-word">在线</div>
      </article>
      <article class="status-block">
        <div class="status-label">命令状态</div>

    function lngDistance(a, b) {
      return Math.abs(((a - b + 540) % 360) - 180);
    }

    function nearestCity(center) {
      return mapCities.reduce((best, city) => {
        const dx = lngDistance(city.lng, center.lng) * Math.cos(center.lat * Math.PI / 180);
        const dy = city.lat - center.lat;
        const distance = Math.hypot(dx, dy);
        return distance < best.distance ? { city, distance } : best;
      }, { city: mapCities[0], distance: Infinity }).city;
    }

    function updateMapLabels() {
      if (!els.mapLabelLayer || !state.mapReady || document.body.dataset.viewMode !== "map") return;
      const center = map.getCenter();
      const zoom = map.getZoom();
      const labelCount = zoom > 10.5 ? 4 : 3;
      const candidates = mapCities
        .map(city => {
          const projected = map.project([city.lng, city.lat]);
          const dx = lngDistance(city.lng, center.lng) * Math.cos(center.lat * Math.PI / 180);
          const dy = city.lat - center.lat;
          return {
            city,
            projected,
            distance: Math.hypot(dx, dy),
            visible: projected.x > 18 && projected.x < state.width - 18 && projected.y > 36 && projected.y < state.height - 80
          };
        })
        .filter(item => item.visible)
        .sort((a, b) => a.distance - b.distance)
        .slice(0, labelCount);

      const focusName = nearestCity(center).name;
      els.mapLabelLayer.replaceChildren();
      const renderLabel = (item, floating = false) => {
        const label = document.createElement("div");
        label.className = `map-city-label${item.city.name === focusName ? " is-focus" : ""}${floating ? " is-floating" : ""}`;
        if (!floating) {
          label.style.left = `${item.projected.x.toFixed(1)}px`;
          label.style.top = `${item.projected.y.toFixed(1)}px`;
        }

        const title = document.createElement("strong");
        title.textContent = floating ? `${item.city.name}附近` : item.city.name;
        const sub = document.createElement("span");
        sub.textContent = item.city.sub;
        label.append(title, sub);
        els.mapLabelLayer.append(label);
      };

      candidates.forEach(item => renderLabel(item));
      if (!candidates.length) {
        const city = nearestCity(center);
        renderLabel({ city, projected: { x: 0, y: 0 }, distance: 0 }, true);
      }

      stage.dataset.mapFocus = focusName;
    }

    function makeCloudTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 512;
      const cloudCtx = canvas.getContext("2d");
      cloudCtx.clearRect(0, 0, canvas.width, canvas.height);

      const belts = [
        { y: 0.27, spread: 0.12, count: 150, alpha: 0.055 },
        { y: 0.48, spread: 0.09, count: 190, alpha: 0.07 },
        { y: 0.68, spread: 0.11, count: 155, alpha: 0.05 }
      ];

      belts.forEach((belt, beltIndex) => {
        for (let i = 0; i < belt.count; i += 1) {
          const x = Math.random() * canvas.width;
          const wave = Math.sin((x / canvas.width) * Math.PI * 4 + beltIndex) * belt.spread * 0.36;
          const y = (belt.y + wave + (Math.random() - 0.5) * belt.spread) * canvas.height;
          const rx = 34 + Math.random() * 76;
          const ry = 8 + Math.random() * 28;
          cloudCtx.save();
          cloudCtx.translate(x, y);
          cloudCtx.rotate((Math.random() - 0.5) * 0.9);
          cloudCtx.scale(1, ry / rx);
          const gradient = cloudCtx.createRadialGradient(0, 0, 0, 0, 0, rx);
          gradient.addColorStop(0, `rgba(255,255,255,${belt.alpha + Math.random() * 0.18})`);
          gradient.addColorStop(0.62, `rgba(255,255,255,${belt.alpha * 0.58})`);
          gradient.addColorStop(1, "rgba(255,255,255,0)");
          cloudCtx.fillStyle = gradient;
          cloudCtx.beginPath();
          cloudCtx.arc(0, 0, rx, 0, Math.PI * 2);
          cloudCtx.fill();
          cloudCtx.restore();
        }
      });

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      texture.needsUpdate = true;
      return texture;
    }

      const rect = stage.getBoundingClientRect();

      renderer.setPixelRatio(state.dpr);

    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

    function lngLatFromUv(uv) {
      const rawLng = uv.x * 360 - 180;
      const lng = ((rawLng + 540) % 360) - 180;
      const lat = uv.y * 180 - 90;
      return [
        Number(lng.toFixed(4)),
        Number(clamp(lat, -82, 82).toFixed(4))
      ];
    }

    function setGlobeScaleTarget(value, immediate = false) {
      const next = clamp(value, MIN_GLOBE_SCALE, MAX_GLOBE_SCALE);
      state.targetGlobeScale = next;

      if (immediate) {

    function wheelDeltaPixels(event) {
      if (event.deltaMode === 1) return event.deltaY * 16;
      if (event.deltaMode === 2) return event.deltaY * Math.max(1, state.height);

    }

    function pinchDistance() {
      const points = Array.from(state.activePointers.values());

      return Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);

    function earthCenterLngLat() {
      camera.updateMatrixWorld();
      earthMesh.updateWorldMatrix(true, false);
      const centerWorld = new THREE.Vector3();
      earthGroup.getWorldPosition(centerWorld);
      const projected = centerWorld.clone().project(camera);
      handoffRaycaster.setFromCamera({ x: projected.x, y: projected.y }, camera);
      const hit = handoffRaycaster.intersectObject(earthMesh, false)[0];
      if (!hit || !hit.uv) return [105, 31];
      return lngLatFromUv(hit.uv);
    }

    function earthLngLatAtPoint(point, fallback = true) {
      camera.updateMatrixWorld();
      earthMesh.updateWorldMatrix(true, false);
      const ndc = {
        x: (point.x / Math.max(1, state.width)) * 2 - 1,
        y: -(point.y / Math.max(1, state.height)) * 2 + 1
      };
      handoffRaycaster.setFromCamera(ndc, camera);
      const hit = handoffRaycaster.intersectObject(earthMesh, false)[0];
      if (!hit || !hit.uv) return fallback ? earthCenterLngLat() : null;
      return lngLatFromUv(hit.uv);
    }

    function handleMapWheel(event) {
      if (document.body.dataset.viewMode !== "map") return;

      event.preventDefault();
      event.stopPropagation();
      const deltaPixels = wheelDeltaPixels(event);
      const zoomingOut = deltaPixels > 0;
      const currentZoom = map.getZoom();

      if (!zoomingOut) {
        state.mapReturnCharge = 0;
        stage.dataset.mapReturnCharge = "0";
        const nextZoom = clamp(currentZoom - deltaPixels * 0.00135, map.getMinZoom ? map.getMinZoom() : 5.4, map.getMaxZoom ? map.getMaxZoom() : 14.6);
        if (map.stop) map.stop();
        map.easeTo({ zoom: nextZoom, duration: 120 });
        return;
      }

      const nextZoom = clamp(currentZoom - deltaPixels * 0.00135, map.getMinZoom ? map.getMinZoom() : 5.4, map.getMaxZoom ? map.getMaxZoom() : 14.6);
      if (currentZoom > MAP_RETURN_ZOOM) {

        stage.dataset.mapReturnCharge = "0";

        map.easeTo({ zoom: nextZoom, duration: 120 });

      if (currentZoom <= MAP_RETURN_ZOOM) {
        state.mapReturnCharge += Math.abs(deltaPixels);
        stage.dataset.mapReturnCharge = String(Math.min(100, Math.round((state.mapReturnCharge / MAP_RETURN_WHEEL_THRESHOLD) * 100)));

        return;
      }

      state.mapReturnCharge = 0;
      stage.dataset.mapReturnCharge = "0";

    function formatDateUTC(date) {

    function recentGibsDates() {
      const now = new Date();
      const dates = [];
      for (let offset = 1; offset <= 6; offset += 1) {
        dates.push(formatDateUTC(new Date(Date.UTC(
          now.getUTCFullYear(),
          now.getUTCMonth(),
          now.getUTCDate() - offset
        ))));
      }
      return dates;
    }

    function gibsWmsUrl(layer, date) {
      const params = new URLSearchParams({
        SERVICE: "WMS",
        VERSION: "1.3.0",
        REQUEST: "GetMap",
        LAYERS: layer,
        STYLES: "",
        FORMAT: "image/jpeg",
        CRS: "EPSG:4326",
        BBOX: "-90,-180,90,180",
        WIDTH: "1024",
        HEIGHT: "512",
        TIME: date
      });
      return `${GIBS_WMS}?${params.toString()}`;
    }

    function eoxSatelliteGlobeUrl() {
      const params = new URLSearchParams({
        SERVICE: "WMS",
        VERSION: "1.3.0",
        REQUEST: "GetMap",
        LAYERS: EOX_SATELLITE_LAYER,
        STYLES: "",
        FORMAT: "image/jpeg",
        CRS: "EPSG:4326",
        BBOX: "-90,-180,90,180",
        WIDTH: "2048",
        HEIGHT: "1024"

    }

    function hashText(text) {
      let hash = 0;
      for (let i = 0; i < text.length; i += 1) {
        hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
      }
      return Math.abs(hash);
    }

    function resolveServiceArea() {
      const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
      const language = navigator.language || "zh-CN";
      const knownZones = [
        [/^Asia\/Shanghai$/i, "上海服务区"],
        [/^Asia\/Chongqing$/i, "成都服务区"],
        [/^Asia\/Urumqi$/i, "西北服务区"],
        [/^Asia\/Hong_Kong$/i, "香港服务区"],
        [/^Asia\/Taipei$/i, "台北服务区"],
        [/^Asia\/Singapore$/i, "新加坡服务区"],
        [/^Asia\/Tokyo$/i, "东京服务区"],
        [/^Asia\/Seoul$/i, "首尔服务区"],
        [/^Europe\/London$/i, "伦敦服务区"],
        [/^Europe\/Paris$/i, "巴黎服务区"],
        [/^Europe\/Berlin$/i, "柏林服务区"],
        [/^America\/Los_Angeles$/i, "洛杉矶服务区"],
        [/^America\/New_York$/i, "纽约服务区"]
      ];
      const matched = knownZones.find(([pattern]) => pattern.test(timeZone));
      if (matched) return { area: matched[1], source: "安全定位" };

      const fallbackAreas = ["本地一号服务区", "本地二号服务区", "本地三号服务区", "本地四号服务区"];
      const area = fallbackAreas[hashText(`${timeZone}|${language}`) % fallbackAreas.length];
      return { area, source: "本机安全推断" };
    }

      let guard = 0;

      }
      try {
        sessionStorage.setItem("hg113-last-operator-seat", seat);

      return `接线员：${seat}号席位`;
    }

    async function loadLiveEarthTexture() {
      if (state.liveTexture) {
        applyEarthMap(state.liveTexture);
        return;
      }

      state.liveLoading = true;
      state.liveError = false;
      syncControls();

      const dates = recentGibsDates();
      for (const date of dates) {
        try {
          const texture = await textureLoader.loadAsync(gibsWmsUrl(GIBS_TRUE_COLOR_LAYER, date));
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
          state.liveTexture = texture;
          state.liveDate = date;
          applyEarthMap(texture);
          state.liveLoading = false;
          syncControls();
          return;
        } catch {
        }
      }

      state.liveLoading = false;
      state.liveError = true;
      state.dataMode = "atlas";
      applyEarthMap(state.satelliteTexture || diffuseMap);
      syncControls();
    }

    function pointerPoint(event) {

    stage.addEventListener("pointerdown", (event) => {

      state.dragging = state.activePointers.size === 1;
      state.lastPointer = point;
      if (state.activePointers.size === 2) {
        state.dragging = false;

    function endPointer(event) {
      state.activePointers.delete(event.pointerId);
      state.dragging = state.activePointers.size === 1;
      state.pinchStartDistance = 0;
      state.pinchStartScale = state.targetGlobeScale;
      if (state.dragging) {
        state.lastPointer = Array.from(state.activePointers.values())[0];

      if (state.activePointers.size === 0) {

      if (state.activePointers.size >= 2) {

        if (state.pinchStartDistance > 0) {

          setGlobeScaleTarget(state.pinchStartScale + delta * 1.18);

      if (state.mapHandoffTriggered) return;
      const deltaPixels = wheelDeltaPixels(event);
      const zoomingIn = deltaPixels < 0;

      const now = performance.now();
      const gestureExpired = now > state.zoomLockUntil;
      const anchorMoved = !state.zoomAnchorPoint ||
        Math.hypot(wheelPoint.x - state.zoomAnchorPoint.x, wheelPoint.y - state.zoomAnchorPoint.y) > ZOOM_ANCHOR_MOVE_PX;
      state.zoomLockUntil = now + ZOOM_INTERACTION_IDLE_MS;
      state.velocity.x = 0;

      const wasAtMax = state.targetGlobeScale >= MAX_GLOBE_SCALE - 0.01;
      const nextScale = state.targetGlobeScale - deltaPixels * WHEEL_ZOOM_SENSITIVITY;

      if (zoomingIn && wasAtMax && nextScale >= MAX_GLOBE_SCALE) {
        if (!wheelAnchor && !state.zoomAnchorLngLat) {
          state.mapHandoffCharge = 0;
          stage.dataset.handoffCharge = "0";
          setGlobeScaleTarget(MAX_GLOBE_SCALE);

        }
        state.mapHandoffCharge += Math.abs(deltaPixels);

        stage.dataset.handoffCharge = "0";
        if (!zoomingIn && nextScale < MAX_GLOBE_SCALE - 0.1) {
          state.zoomAnchorLngLat = null;
          state.zoomAnchorPoint = null;

        }

      setGlobeScaleTarget(nextScale);
    }, { passive: false });

    function layoutWords(maxWidth, cursor) {
      const maxChars = Math.max(4, Math.floor(maxWidth / 6.45));
      let line = "";
      let used = 0;
      let guard = 0;
      while (guard < 80) {
        const word = sourceWords[cursor.index % sourceWords.length];
        const extra = line ? word.length + 1 : word.length;
        if (line && used + extra > maxChars) break;
        line = line ? `${line} ${word}` : word;
        used += extra;
        cursor.index += 1;
        guard += 1;
        if (used > maxChars * 0.92) break;
      }
      return line;
    }

    function drawSurfaceText(now) {
      ctx.font = "bold 11px Courier New, monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillStyle = `rgba(255, 255, 255, ${state.textAlpha})`;
      ctx.shadowColor = "rgba(255, 255, 255, 0.36)";
      ctx.shadowBlur = 2;

      const cursor = { index: Math.floor(now * 0.002) % sourceWords.length };
      const scaleX = state.maskWidth / state.width;
      const scaleY = state.maskHeight / state.height;
      const stepX = state.width > 900 ? 4 : 5;

      for (let y = 0; y < state.height; y += state.lineHeight) {
        const maskY = Math.floor((state.height - 1 - y) * scaleY);
        if (maskY < 0 || maskY >= state.maskHeight) continue;

        let inLand = false;
        let startX = 0;

        for (let x = 0; x <= state.width; x += stepX) {
          const inside = x < state.width;
          let isLand = false;
          if (inside) {
            const maskX = Math.floor(x * scaleX);
            const idx = (maskY * state.maskWidth + maskX) * 4;
            isLand = state.maskPixels[idx] > 128;
          }

          if (isLand && !inLand) {
            inLand = true;
            startX = x;
          } else if ((!isLand || !inside) && inLand) {
            inLand = false;
            const segmentWidth = x - startX;
            if (segmentWidth > 18) {
              const text = layoutWords(segmentWidth, cursor);
              if (text) ctx.fillText(text, startX, y);
            }
          }
        }
      }

      ctx.shadowBlur = 0;
    }

    function updatePanels(now) {
      state.fpsFrames += 1;
      if (now - state.fpsLast > 500) {
        state.fpsValue = Math.round((state.fpsFrames * 1000) / (now - state.fpsLast));
        state.fpsFrames = 0;
        state.fpsLast = now;
      }

      const linkStates = ["接收命令中", "执行命令中", "汇报工作中"];
      const sector = linkStates[Math.floor(now * 0.00045) % linkStates.length];

      setText(els.fps, state.fpsValue ? String(state.fpsValue) : "--");
      setText(els.rot, earthGroup.rotation.y.toFixed(2));
      setText(els.mask, state.maskPixels[0] !== undefined ? "运行" : "就绪");
      setText(els.status, state.paused ? "暂停" : "在线");
      setText(els.sector, sector);
      setText(els.coordA, `${serviceProfile.area} / ${serviceProfile.source}`);
      setText(els.coordB, operatorSeat);
    }

    function updateClock() {
      const now = new Date();
      els.clock.textContent = now.toLocaleTimeString("en-US", {
        hour12: false,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function render(now) {
      requestAnimationFrame(render);

      if (Math.abs(state.targetGlobeScale - state.globeScale) > 0.001) {
        state.globeScale += (state.targetGlobeScale - state.globeScale) * 0.16;
        updateGlobeFrame();
      }

      if (!state.paused) {
        const zoomInteractionActive = performance.now() < state.zoomLockUntil || state.mapHandoffTriggered;
        if (!state.dragging && !zoomInteractionActive) {
          state.velocity.x *= 0.95;
          state.velocity.y *= 0.95;
          const floor = 0.002 * state.speed;
          if (Math.abs(state.velocity.y) < floor) state.velocity.y = floor;
        }
        if (!zoomInteractionActive) {
          earthGroup.rotation.x += state.velocity.x * state.speed;
          earthGroup.rotation.y += state.velocity.y * state.speed;
        }
        cloudMesh.rotation.y += 0.00018 * state.speed;
      }

      earthGroup.rotation.x = clamp(earthGroup.rotation.x, -0.92, 0.92);
      maskGroup.rotation.copy(earthGroup.rotation);

      renderer.setRenderTarget(null);
      renderer.render(scene, camera);

      renderer.setRenderTarget(maskTarget);
      renderer.render(maskScene, camera);
      renderer.readRenderTargetPixels(maskTarget, 0, 0, state.maskWidth, state.maskHeight, state.maskPixels);
      renderer.setRenderTarget(null);

      ctx.clearRect(0, 0, state.width, state.height);

      drawSurfaceText(now);
      updatePanels(now);
    }

    window.addEventListener("resize", resize);
    resize();
    applyEarthLighting();
    syncControls();
    updateClock();
    setInterval(updateClock, 1000);
    requestAnimationFrame(render);
  </script>
</body>
</html>
