<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>真实地图地球</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #020403;
      --ink: #f7f3e8;
      --muted: rgba(247, 243, 232, 0.68);
      --accent: #7df6e3;
      --accent-soft: rgba(125, 246, 227, 0.16);
      --glass: linear-gradient(145deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.055));
      --glass-strong: linear-gradient(145deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.08));
      --glass-dark: rgba(7, 15, 14, 0.48);
      --glass-stroke: rgba(255, 255, 255, 0.22);
      --glass-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
      --ui: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--ui);
      letter-spacing: 0;
    }

    a,
    button {
      color: inherit;
      font: inherit;
    }

    #map,
    #earth-canvas,
    #earth-text-canvas,
    #signal-canvas {
      position: fixed;
      inset: 0;
      background: var(--bg);
    }

    #map {
      z-index: 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity 520ms ease, visibility 520ms ease;
    }

    #earth-canvas {
      z-index: 1;
      display: block;
      opacity: 1;
      visibility: visible;
      cursor: grab;
      touch-action: none;
      transition: opacity 520ms ease, visibility 520ms ease;
    }

    body[data-earth-dragging="true"] #earth-canvas {
      cursor: grabbing;
    }

    #earth-text-canvas,
    #signal-canvas {
      z-index: 2;
      display: block;
      background: transparent;
      pointer-events: none;
      opacity: 1;
      visibility: visible;
      mix-blend-mode: screen;
      transition: opacity 520ms ease, visibility 520ms ease;
    }

    #signal-canvas {
      z-index: 3;
    }

    body[data-view-mode="city"] #map {
      opacity: 1;
      visibility: visible;
    }

    body[data-view-mode="city"] #earth-canvas,
    body[data-view-mode="city"] #earth-text-canvas,
    body[data-view-mode="city"] #signal-canvas,
    body[data-surface-mode="off"] #earth-text-canvas,
    body[data-signal-mode="off"] #signal-canvas {
      opacity: 0;
      visibility: hidden;
    }

    #handoff-curtain {
      position: fixed;
      inset: 0;
      z-index: 4;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 48%, rgba(247, 243, 232, 0.04), transparent 18%),
        radial-gradient(circle at 50% 48%, rgba(2, 4, 3, 0.38), rgba(2, 4, 3, 0.94) 72%);
      backdrop-filter: blur(14px) saturate(1.08);
      -webkit-backdrop-filter: blur(14px) saturate(1.08);
      transition: opacity 780ms ease, visibility 780ms ease;
    }

    body[data-entering-map="true"] #handoff-curtain {
      opacity: 1;
      visibility: visible;
    }

    .maplibregl-canvas {
      outline: 0;
    }

    .topbar {
      position: fixed;
      z-index: 5;
      top: 16px;
      left: 16px;
      right: 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      pointer-events: none;
      transition: opacity 520ms ease, filter 520ms ease, transform 520ms ease;
    }

    .identity {
      pointer-events: auto;
      max-width: min(720px, calc(100vw - 32px));
    }

    h1 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(30px, 3.5vw, 56px);
      line-height: 0.9;
      font-weight: 850;
      text-shadow: 0 8px 28px rgba(0, 0, 0, 0.72);
    }

    .subline {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
      text-shadow: 0 8px 24px rgba(0, 0, 0, 0.62);
    }

    .ribbon {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 14px;
      pointer-events: auto;
    }

    .pill,
    .back-link {
      min-height: 31px;
      display: inline-flex;
      align-items: center;
      padding: 0 12px;
      border: 1px solid var(--glass-stroke);
      border-radius: 999px;
      background: var(--glass);
      color: var(--ink);
      text-decoration: none;
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(24px) saturate(1.35);
      -webkit-backdrop-filter: blur(24px) saturate(1.35);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease, color 180ms ease;
    }

    .back-link {
      background: linear-gradient(145deg, rgba(247, 243, 232, 0.22), rgba(247, 243, 232, 0.08));
      color: rgba(247, 243, 232, 0.94);
    }

    .back-link:hover,
    .pill:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.36);
      background: var(--glass-strong);
    }

    body[data-view-mode="city"] h1,
    body[data-view-mode="city"] .subline,
    body[data-view-mode="city"] .clock {
      color: rgba(9, 16, 15, 0.82);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.62), 0 14px 34px rgba(255, 255, 255, 0.38);
    }

    body[data-view-mode="city"] .clock-label {
      color: rgba(9, 16, 15, 0.56);
    }

    body[data-view-mode="city"] .pill,
    body[data-view-mode="city"] .back-link,
    body[data-view-mode="city"] .control-panel,
    body[data-view-mode="city"] .maplibregl-ctrl-group {
      border-color: rgba(255, 255, 255, 0.28);
      background: linear-gradient(145deg, rgba(9, 17, 16, 0.56), rgba(9, 17, 16, 0.24));
      color: rgba(255, 255, 255, 0.9);
      box-shadow: 0 24px 70px rgba(22, 35, 34, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    body[data-view-mode="city"] .map-button {
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.88);
    }

    body[data-view-mode="city"] .map-button:hover,
    body[data-view-mode="city"] .map-button[aria-pressed="true"] {
      border-color: rgba(255, 255, 255, 0.72);
      background: rgba(255, 255, 255, 0.74);
      color: rgba(5, 12, 11, 0.9);
    }

    body[data-view-mode="city"] .status-line {
      border-color: rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.72);
    }

    .clock {
      pointer-events: auto;
      min-width: 220px;
      text-align: right;
      text-shadow: 0 10px 28px rgba(0, 0, 0, 0.72);
    }

    .clock-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }

    .clock-time {
      margin-top: 2px;
      font-family: var(--display);
      font-size: 29px;
      line-height: 0.9;
      font-weight: 850;
    }

    .control-panel {
      position: fixed;
      z-index: 5;
      left: 18px;
      bottom: 18px;
      width: min(500px, calc(100vw - 36px));
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--glass-stroke);
      border-radius: 28px;
      background: var(--glass);
      box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.18), inset 0 -1px 0 rgba(255, 255, 255, 0.055);
      backdrop-filter: blur(28px) saturate(1.35);
      -webkit-backdrop-filter: blur(28px) saturate(1.35);
      pointer-events: auto;
      transition: opacity 520ms ease, filter 520ms ease, transform 520ms ease;
    }

    body[data-entering-map="true"] .topbar,
    body[data-entering-map="true"] .control-panel {
      opacity: 0;
      filter: blur(8px);
      transform: translateY(10px);
      pointer-events: none;
    }

    .button-row,
    .city-row {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .map-button {
      min-height: 37px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(247, 243, 232, 0.88);
      cursor: pointer;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 650;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px) saturate(1.28);
      -webkit-backdrop-filter: blur(18px) saturate(1.28);
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease, color 180ms ease, box-shadow 180ms ease;
    }

    .map-button:hover,
    .map-button[aria-pressed="true"] {
      border-color: rgba(125, 246, 227, 0.32);
      background: rgba(125, 246, 227, 0.2);
      color: rgba(247, 243, 232, 0.98);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 10px 28px rgba(0, 0, 0, 0.22);
    }

    .map-button:active {
      transform: scale(0.98);
    }

    .status-line {
      width: auto;
      max-width: 100%;
      justify-self: start;
      padding: 9px 13px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.07);
      color: rgba(247, 243, 232, 0.68);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px) saturate(1.22);
      -webkit-backdrop-filter: blur(18px) saturate(1.22);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.48;
      overflow-wrap: anywhere;
    }

    .maplibregl-ctrl-bottom-left,
    .maplibregl-ctrl-bottom-right {
      display: none;
    }

    .maplibregl-ctrl-top-right {
      top: 112px;
      right: 16px;
    }

    .maplibregl-ctrl-group {
      overflow: hidden;
      border: 1px solid var(--glass-stroke);
      border-radius: 20px;
      background: var(--glass);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(24px) saturate(1.32);
      -webkit-backdrop-filter: blur(24px) saturate(1.32);
    }

    .maplibregl-ctrl button {
      width: 36px;
      height: 36px;
      border: 0;
      filter: invert(1) opacity(0.86);
    }

    .maplibregl-ctrl-group button + button {
      border-top: 0;
    }

    .maplibregl-ctrl button:not(:disabled):hover {
      background: rgba(255, 255, 255, 0.16);
    }

    body[data-view-mode="earth"] .maplibregl-ctrl-top-right {
      display: none;
    }

    @media (max-width: 700px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .clock {
        display: none;
      }

      .control-panel {
        left: 12px;
        right: 12px;
        bottom: 12px;
        width: auto;
        gap: 10px;
        padding: 12px;
        border-radius: 24px;
      }

      .map-button {
        min-height: 34px;
        padding: 0 11px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body data-view-mode="earth" data-surface-mode="on" data-signal-mode="on">
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      if (params.get("handoff") === "map" || params.get("view") === "map") {
        document.body.dataset.viewMode = "city";
        document.body.dataset.enteringMap = "true";
      }
    })();
  </script>
  <main aria-label="真实地图地球">
    <div id="map"></div>
    <canvas id="earth-canvas" aria-label="Blue Marble 地球"></canvas>
    <canvas id="earth-text-canvas" aria-hidden="true"></canvas>
    <canvas id="signal-canvas" aria-label="语言信号星环"></canvas>
    <div id="handoff-curtain" aria-hidden="true"></div>

    <header class="topbar">
      <section class="identity" aria-label="地图身份">
        <h1>真实地图地球</h1>
        <div class="subline">真实底图 / 干净地球 / 城市级缩放</div>
        <div class="ribbon" aria-label="数据状态">
          <a class="back-link" href="./index.html">返回地球页</a>
          <span class="pill" id="base-state">底图：连接中</span>
          <span class="pill" id="cloud-state">云层：暂不启用</span>
          <span class="pill" id="signal-state">星环：弧形文字</span>
          <span class="pill" id="zoom-state">缩放：全球</span>
        </div>
      </section>

      <section class="clock" aria-label="本地时间">
        <div class="clock-label">本地时间</div>
        <div class="clock-time" id="clock">00:00:00</div>
      </section>
    </header>

    <section class="control-panel" aria-label="地图控制">
      <div class="button-row">
        <button class="map-button" id="globe-view" type="button" aria-pressed="true">地球视图</button>
        <button class="map-button" id="city-view" type="button">上海市区</button>
        <button class="map-button" id="surface-toggle" type="button" aria-pressed="true">地表文字</button>
        <button class="map-button" id="signal-toggle" type="button" aria-pressed="true">文字星环</button>
      </div>
      <div class="city-row" aria-label="城市跳转">
        <button class="map-button" type="button" data-city="shanghai">上海</button>
        <button class="map-button" type="button" data-city="beijing">北京</button>
        <button class="map-button" type="button" data-city="tokyo">东京</button>
        <button class="map-button" type="button" data-city="newyork">纽约</button>
        <button class="map-button" type="button" data-city="london">伦敦</button>
      </div>
      <div class="status-line" id="status-line">正在初始化真实地图引擎</div>
    </section>
  </main>

  <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
  <script>
    const els = {
      baseState: document.getElementById("base-state"),
      cloudState: document.getElementById("cloud-state"),
      signalState: document.getElementById("signal-state"),
      zoomState: document.getElementById("zoom-state"),
      statusLine: document.getElementById("status-line"),
      globeView: document.getElementById("globe-view"),
      cityView: document.getElementById("city-view"),
      surfaceToggle: document.getElementById("surface-toggle"),
      signalToggle: document.getElementById("signal-toggle"),
      clock: document.getElementById("clock")
    };

    const cities = {
      shanghai: { name: "上海", center: [121.4737, 31.2304], zoom: 11.4 },
      beijing: { name: "北京", center: [116.4074, 39.9042], zoom: 11.2 },
      tokyo: { name: "东京", center: [139.767, 35.6812], zoom: 11.5 },
      newyork: { name: "纽约", center: [-74.006, 40.7128], zoom: 11.2 },
      london: { name: "伦敦", center: [-0.1276, 51.5072], zoom: 11.1 }
    };

    function updateClock() {
      const now = new Date();
      els.clock.textContent = now.toLocaleTimeString("en-US", {
        hour12: false,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function zoomLabel(zoom) {
      if (zoom >= 10) return "城市级";
      if (zoom >= 6) return "区域级";
      if (zoom >= 2.5) return "国家级";
      return "全球";
    }

    updateClock();
    setInterval(updateClock, 1000);
    const routeParams = new URLSearchParams(window.location.search);
    const shouldOpenRealMap = routeParams.get("handoff") === "map" || routeParams.get("view") === "map";
    const routeLng = Number(routeParams.get("lng"));
    const routeLat = Number(routeParams.get("lat"));
    const routeZoom = Number(routeParams.get("z"));
    const handoffCenter = [
      Number.isFinite(routeLng) ? Math.max(-180, Math.min(180, routeLng)) : 105,
      Number.isFinite(routeLat) ? Math.max(-82, Math.min(82, routeLat)) : 31
    ];
    const handoffZoom = Number.isFinite(routeZoom) ? Math.max(5.8, Math.min(13, routeZoom)) : 10.4;
    document.body.dataset.viewMode = shouldOpenRealMap ? "city" : "earth";
    document.body.dataset.surfaceMode = "on";
    document.body.dataset.signalMode = "on";

    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: shouldOpenRealMap ? handoffCenter : [105, 31],
      zoom: shouldOpenRealMap ? Math.max(3.8, handoffZoom - 2.2) : 1.72,
      pitch: 0,
      bearing: 0,
      attributionControl: false
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
    let mapReady = false;
    let earthHandoffActive = false;
    let mapReturnLockedUntil = 0;
    let previousMapZoom = map.getZoom();

    const MAP_RETURN_ZOOM = 3.15;
    const MAP_RETURN_DELTA = 0.018;

    function lockMapReturn(duration = 0) {
      mapReturnLockedUntil = Date.now() + duration;
    }

    function tuneAtmosphere() {
      if (map.setFog) {
        map.setFog({
          color: "rgb(2, 4, 3)",
          "high-color": "rgb(12, 36, 34)",
          "horizon-blend": 0.05,
          "space-color": "rgb(2, 4, 3)",
          "star-intensity": 0.08
        });
      }
    }

    function cleanLngLat(center) {
      if (!Array.isArray(center) || center.length < 2) return [105, 31];
      const lng = Number.isFinite(center[0]) ? Math.max(-180, Math.min(180, center[0])) : 105;
      const lat = Number.isFinite(center[1]) ? Math.max(-82, Math.min(82, center[1])) : 31;
      return [lng, lat];
    }

    function mapZoomFromEarthProgress(progress) {
      return 3.6 + Math.max(0, Math.min(1, progress)) * 2.4;
    }

    function prewarmMapFromEarth(detail = {}) {
      if (!mapReady || document.body.dataset.viewMode !== "earth") return;
      const center = cleanLngLat(detail.center);
      const progress = Number(detail.progress) || 0;
      map.jumpTo({
        center,
        zoom: Math.min(5.2, mapZoomFromEarthProgress(progress)),
        pitch: 0,
        bearing: 0
      });
    }

    function applyMapHandoffFromEarth(detail = {}) {
      if (earthHandoffActive) return;
      earthHandoffActive = true;
      const center = cleanLngLat(detail.center);
      const zoom = Math.max(5.8, mapZoomFromEarthProgress(Number(detail.progress) || 1));
      lockMapReturn(1900);
      previousMapZoom = zoom;

      document.body.dataset.viewMode = "city";
      els.globeView.setAttribute("aria-pressed", "false");
      els.cityView.setAttribute("aria-pressed", "true");
      els.baseState.textContent = "底图：OpenFreeMap";
      els.cloudState.textContent = "云层：不叠加";
      els.signalState.textContent = "星环：地图模式隐藏";
      els.zoomState.textContent = `缩放：${zoomLabel(zoom)}`;
      els.statusLine.textContent = "已在贴图变糊前切入真实地图数据，可继续放大到街区";

      map.resize();
      if (map.stop) map.stop();
      map.jumpTo({
        center,
        zoom: Math.max(3.8, zoom - 1.1),
        pitch: 0,
        bearing: 0
      });
      map.easeTo({
        center,
        zoom,
        pitch: 0,
        bearing: 0,
        duration: 1350,
        essential: true
      });
    }

    function applyRoutedMapHandoff() {
      earthHandoffActive = true;
      const center = cleanLngLat(handoffCenter);
      const zoom = handoffZoom;
      lockMapReturn(2600);
      previousMapZoom = zoom;
      document.body.dataset.handoffCenter = `${center[0].toFixed(4)},${center[1].toFixed(4)}`;

      document.body.dataset.viewMode = "city";
      els.globeView.setAttribute("aria-pressed", "false");
      els.cityView.setAttribute("aria-pressed", "true");
      els.baseState.textContent = "底图：OpenFreeMap";
      els.cloudState.textContent = "云层：不叠加";
      els.signalState.textContent = "星环：地图模式隐藏";
      els.zoomState.textContent = `缩放：${zoomLabel(zoom)}`;
      els.statusLine.textContent = "已承接地球定位，可继续滚轮放大查看街区";

      map.resize();
      if (map.stop) map.stop();
      map.jumpTo({
        center,
        zoom: Math.max(3.8, zoom - 2.35),
        pitch: 0,
        bearing: 0
      });

      requestAnimationFrame(() => {
        window.setTimeout(() => {
          delete document.body.dataset.enteringMap;
        }, 260);
        map.easeTo({
          center,
          zoom,
          pitch: 0,
          bearing: 0,
          duration: 1650,
          essential: true
        });
      });
    }

    function applyEarthView() {
      earthHandoffActive = false;
      document.body.dataset.viewMode = "earth";
      els.globeView.setAttribute("aria-pressed", "true");
      els.cityView.setAttribute("aria-pressed", "false");
      els.baseState.textContent = "底图：Blue Marble";
      els.cloudState.textContent = "云层：关闭";
      els.signalState.textContent = "星环：弧形文字";
      els.zoomState.textContent = "缩放：全球";
      els.statusLine.textContent = "已切到 Three.js 地球；显示地表短词与弧形文字环，云层关闭";
      window.dispatchEvent(new CustomEvent("earth-reset-view"));
    }

    function applyCityView(cityKey) {
      lockMapReturn(1500);
      document.body.dataset.viewMode = "city";
      els.globeView.setAttribute("aria-pressed", "false");
      els.cityView.setAttribute("aria-pressed", "true");
      els.baseState.textContent = "底图：OpenFreeMap";
      els.cloudState.textContent = "云层：不叠加";
      els.signalState.textContent = "星环：地图模式隐藏";
      flyToCity(cityKey);
    }

    function flyToCity(cityKey) {
      const city = cities[cityKey];
      if (!city) return;
      lockMapReturn(1500);
      previousMapZoom = city.zoom;
      map.flyTo({
        center: city.center,
        zoom: city.zoom,
        pitch: 0,
        bearing: 0,
        duration: 1200,
        essential: true
      });
      els.statusLine.textContent = `已定位到${city.name}市区，可继续滚轮放大查看街区`;
    }

    map.on("load", () => {
      mapReady = true;
      if (map.setProjection) {
        map.setProjection({ type: "globe" });
      }
      tuneAtmosphere();

      els.baseState.textContent = "底图：OpenFreeMap";
      els.cloudState.textContent = "云层：暂不启用";
      els.statusLine.textContent = "真实地图已加载；默认使用干净 Three.js 地球";
      if (shouldOpenRealMap) {
        applyRoutedMapHandoff();
      } else {
        applyEarthView();
      }
    });

    map.on("zoom", () => {
      if (document.body.dataset.viewMode === "city") {
        const zoom = map.getZoom();
        const zoomingOut = zoom < previousMapZoom - MAP_RETURN_DELTA;
        els.zoomState.textContent = `缩放：${zoomLabel(zoom)}`;
        if (zoomingOut && zoom <= MAP_RETURN_ZOOM && Date.now() > mapReturnLockedUntil) {
          if (map.stop) map.stop();
          applyEarthView();
          return;
        }
        previousMapZoom = zoom;
      }
    });

    map.on("error", (event) => {
      const message = event && event.error && event.error.message ? event.error.message : "地图数据连接失败";
      if (/tile|source|style/i.test(message)) {
        els.statusLine.textContent = "部分地图瓦片暂时不可用，稍后会自动重试";
      }
    });

    els.globeView.addEventListener("click", () => {
      applyEarthView();
    });

    els.cityView.addEventListener("click", () => applyCityView("shanghai"));

    els.surfaceToggle.addEventListener("click", () => {
      const next = document.body.dataset.surfaceMode === "on" ? "off" : "on";
      document.body.dataset.surfaceMode = next;
      els.surfaceToggle.setAttribute("aria-pressed", String(next === "on"));
      els.statusLine.textContent = next === "on" ? "地表文字已开启" : "地表文字已隐藏";
    });

    els.signalToggle.addEventListener("click", () => {
      const next = document.body.dataset.signalMode === "on" ? "off" : "on";
      document.body.dataset.signalMode = next;
      els.signalToggle.setAttribute("aria-pressed", String(next === "on"));
      els.signalState.textContent = next === "on" ? "星环：弧形文字" : "星环：已隐藏";
      els.statusLine.textContent = next === "on" ? "弧形文字环已开启" : "弧形文字环已隐藏";
    });

    document.querySelectorAll("[data-city]").forEach((button) => {
      button.addEventListener("click", () => applyCityView(button.dataset.city));
    });

    window.addEventListener("earth-zoom-state", (event) => {
      if (document.body.dataset.viewMode !== "earth") return;
      const progress = Math.max(0, Math.min(1, Number(event.detail && event.detail.progress) || 0));
      const percent = Math.round(progress * 100);
      els.zoomState.textContent = percent > 2 ? `缩放：地球 ${percent}%` : "缩放：全球";
      if (progress > 0.72) {
        els.statusLine.textContent = "继续放大将切入真实地图数据";
      } else if (progress > 0.08) {
        els.statusLine.textContent = "Three.js 地球缩放中；贴图清晰范围内";
      }
    });

    window.addEventListener("earth-map-prewarm", (event) => {
      prewarmMapFromEarth(event.detail || {});
    });

    window.addEventListener("earth-map-handoff", (event) => {
      applyMapHandoffFromEarth(event.detail || {});
    });
  </script>
  <script type="module">
    import * as THREE from "./vendor/three.module.js";

    const earthCanvas = document.getElementById("earth-canvas");
    const surfaceCanvas = document.getElementById("earth-text-canvas");
    const signalCanvas = document.getElementById("signal-canvas");
    const surfaceCtx = surfaceCanvas.getContext("2d", { alpha: true });
    const signalCtx = signalCanvas.getContext("2d", { alpha: true });

    const renderer = new THREE.WebGLRenderer({ canvas: earthCanvas, antialias: true, alpha: false });
    renderer.setClearColor(0x020403, 1);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.z = 3.35;

    const maskScene = new THREE.Scene();
    const maskTarget = new THREE.WebGLRenderTarget(320, 320, {
      minFilter: THREE.NearestFilter,
      magFilter: THREE.NearestFilter,
      depthBuffer: true,
      stencilBuffer: false
    });

    const earthGroup = new THREE.Group();
    earthGroup.rotation.x = -0.24;
    earthGroup.rotation.y = -1.18;
    scene.add(earthGroup);

    const maskGroup = new THREE.Group();
    maskScene.add(maskGroup);

    const geometry = new THREE.SphereGeometry(1, 112, 112);
    const loader = new THREE.TextureLoader();
    const diffuseMap = await loader.loadAsync("./assets/earth-blue-marble.jpg");
    const waterMap = await loader.loadAsync("./assets/earth-water.png");
    diffuseMap.colorSpace = THREE.SRGBColorSpace;

    const earth = new THREE.Mesh(
      geometry,
      new THREE.MeshPhongMaterial({
        map: diffuseMap,
        specularMap: waterMap,
        specular: new THREE.Color(0x333333),
        shininess: 18
      })
    );
    earthGroup.add(earth);

    const atmosphere = new THREE.Mesh(
      geometry,
      new THREE.MeshBasicMaterial({
        color: 0x9cf7ee,
        transparent: true,
        opacity: 0.045,
        blending: THREE.AdditiveBlending,
        side: THREE.BackSide,
        depthWrite: false
      })
    );
    atmosphere.scale.setScalar(1.024);
    earthGroup.add(atmosphere);

    const maskMaterial = new THREE.ShaderMaterial({
      uniforms: {
        waterMap: { value: waterMap }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D waterMap;
        varying vec2 vUv;
        void main() {
          vec4 waterColor = texture2D(waterMap, vUv);
          if (waterColor.r < 0.5) {
            gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0);
          } else {
            gl_FragColor = vec4(0.0, 1.0, 0.0, 1.0);
          }
        }
      `
    });
    maskGroup.add(new THREE.Mesh(geometry, maskMaterial));

    scene.add(new THREE.AmbientLight(0xffffff, 0.38));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.55);
    keyLight.position.set(4.5, 2.8, 4.8);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xffffff, 0.16);
    fillLight.position.set(-3.2, 2.1, 2.8);
    scene.add(fillLight);

    const state = {
      width: 1,
      height: 1,
      dpr: 1,
      maskWidth: 320,
      maskHeight: 320,
      maskPixels: new Uint8Array(320 * 320 * 4),
      dragging: false,
      lastPointer: { x: 0, y: 0 },
      activePointers: new Map(),
      pinchStartDistance: 0,
      pinchStartZoom: 0,
      velocity: { x: 0.0005, y: 0.0011 },
      zoom: 0,
      targetZoom: 0,
      baseCameraZ: 5.85,
      minCameraZ: 3.35,
      handoffTriggered: false
    };

    const HANDOFF_ZOOM = 0.97;
    const PREWARM_ZOOM = 0.66;
    const WHEEL_ZOOM_SENSITIVITY = 0.00145;
    const raycaster = new THREE.Raycaster();
    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
    const lerp = (from, to, amount) => from + (to - from) * amount;

    const sourceWords = (
      "LITHOSPHERE METRICS: NOMINAL. SUBDUCTION ZONE SEISMICITY: ELEVATED. " +
      "CONTINENTAL CRUST THICKNESS: 35KM AVG. MANTLE CONVECTION CURRENTS: STABLE. " +
      "PANGEA PROJECTION MODEL: RUNNING. TOPOGRAPHICAL DEVIATION: WITHIN TOLERANCE. " +
      "BIOME SATURATION: 78%. ATMOSPHERIC PRESSURE: 1013 HPA. OCEANIC TRENCH DEPTH: 10994M."
    ).split(/\s+/);

    const orbitalText = (
      "BANDWIDTH • LATENCY • ORBITAL PERIOD • SATELLITE UPLINK • TELEMETRY • "
    ).repeat(10);

    function isEarthMode() {
      return document.body.dataset.viewMode !== "city";
    }

    function layoutWords(maxWidth, cursor) {
      const maxChars = Math.max(4, Math.min(18, Math.floor(maxWidth / 6.7)));
      let line = "";
      let used = 0;
      let guard = 0;

      while (guard < 80) {
        const word = sourceWords[cursor.index % sourceWords.length];
        const extra = line ? word.length + 1 : word.length;
        if (line && used + extra > maxChars) break;
        line = line ? `${line} ${word}` : word;
        used += extra;
        cursor.index += 1;
        guard += 1;
        if (used > maxChars * 0.92) break;
      }

      return line;
    }

    function seededUnit(x, y) {
      const value = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
      return value - Math.floor(value);
    }

    function resizeOverlayCanvas(canvas, ctx) {
      canvas.width = Math.floor(state.width * state.dpr);
      canvas.height = Math.floor(state.height * state.dpr);
      canvas.style.width = `${state.width}px`;
      canvas.style.height = `${state.height}px`;
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    }

    function updateCameraForZoom() {
      const eased = 1 - Math.pow(1 - state.zoom, 2);
      camera.position.z = lerp(state.baseCameraZ, state.minCameraZ, eased);
    }

    function resizeEarth() {
      const width = Math.max(1, window.innerWidth);
      const height = Math.max(1, window.innerHeight);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      state.width = width;
      state.height = height;
      state.dpr = dpr;

      renderer.setPixelRatio(dpr);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      const aspect = width / height;
      let z = width > 860 ? 5.85 : 5.3;
      if (aspect > 1.8) z = 5.62;
      if (aspect < 0.72) z = 5.65;
      state.baseCameraZ = z;
      state.minCameraZ = width > 860 ? 3.32 : 3.58;
      if (aspect < 0.72) state.minCameraZ = 3.86;
      updateCameraForZoom();
      const shift = 0;
      earthGroup.position.x = shift;
      maskGroup.position.x = shift;

      resizeOverlayCanvas(surfaceCanvas, surfaceCtx);
      resizeOverlayCanvas(signalCanvas, signalCtx);

      const maxMaskSide = width > 1000 ? 320 : 240;
      const scale = maxMaskSide / Math.max(width, height);
      state.maskWidth = Math.max(96, Math.floor(width * scale));
      state.maskHeight = Math.max(96, Math.floor(height * scale));
      state.maskPixels = new Uint8Array(state.maskWidth * state.maskHeight * 4);
      maskTarget.setSize(state.maskWidth, state.maskHeight);
    }

    function pointerPoint(event) {
      const rect = earthCanvas.getBoundingClientRect();
      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
    }

    function pinchDistance() {
      const points = Array.from(state.activePointers.values());
      if (points.length < 2) return 0;
      return Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
    }

    function setZoomTarget(value) {
      state.targetZoom = clamp(value, 0, 1);
      dispatchZoomState();
      if (state.targetZoom >= HANDOFF_ZOOM) {
        triggerMapHandoff();
      }
    }

    function endPointer(event) {
      state.activePointers.delete(event.pointerId);
      state.dragging = state.activePointers.size === 1;
      state.pinchStartDistance = 0;
      state.pinchStartZoom = state.targetZoom;

      if (state.dragging) {
        state.lastPointer = Array.from(state.activePointers.values())[0];
      }

      if (state.activePointers.size === 0) {
        state.dragging = false;
      }

      document.body.dataset.earthDragging = "false";
      if (event && earthCanvas.hasPointerCapture(event.pointerId)) {
        earthCanvas.releasePointerCapture(event.pointerId);
      }
    }

    function earthCenterLngLat() {
      raycaster.setFromCamera({ x: 0, y: 0 }, camera);
      const hit = raycaster.intersectObject(earth, false)[0];
      if (!hit || !hit.uv) return [105, 31];
      const lng = hit.uv.x * 360 - 180;
      const lat = 90 - hit.uv.y * 180;
      return [lng, lat];
    }

    function dispatchZoomState() {
      const detail = {
        progress: state.targetZoom,
        center: earthCenterLngLat()
      };
      window.dispatchEvent(new CustomEvent("earth-zoom-state", { detail }));
      if (state.targetZoom >= PREWARM_ZOOM && !state.handoffTriggered) {
        window.dispatchEvent(new CustomEvent("earth-map-prewarm", { detail }));
      }
    }

    function triggerMapHandoff() {
      if (state.handoffTriggered) return;
      state.handoffTriggered = true;
      state.targetZoom = HANDOFF_ZOOM;
      window.dispatchEvent(new CustomEvent("earth-map-handoff", {
        detail: {
          progress: state.targetZoom,
          center: earthCenterLngLat()
        }
      }));
    }

    function resetEarthInteraction() {
      state.dragging = false;
      state.activePointers.clear();
      state.pinchStartDistance = 0;
      state.pinchStartZoom = 0;
      state.zoom = 0;
      state.targetZoom = 0;
      state.handoffTriggered = false;
      state.velocity.x = 0.0005;
      state.velocity.y = 0.0011;
      document.body.dataset.earthDragging = "false";
      updateCameraForZoom();
    }

    earthCanvas.addEventListener("pointerdown", (event) => {
      if (!isEarthMode()) return;
      const point = pointerPoint(event);
      state.activePointers.set(event.pointerId, point);
      state.dragging = state.activePointers.size === 1;
      state.lastPointer = point;
      if (state.activePointers.size === 2) {
        state.dragging = false;
        state.pinchStartDistance = pinchDistance();
        state.pinchStartZoom = state.targetZoom;
      }
      document.body.dataset.earthDragging = state.activePointers.size ? "true" : "false";
      earthCanvas.setPointerCapture(event.pointerId);
      event.preventDefault();
    });

    earthCanvas.addEventListener("pointermove", (event) => {
      const next = pointerPoint(event);
      if (state.activePointers.has(event.pointerId)) {
        state.activePointers.set(event.pointerId, next);
      }
      if (!isEarthMode()) return;

      if (state.activePointers.size >= 2) {
        const distance = pinchDistance();
        if (state.pinchStartDistance > 0) {
          const delta = (distance - state.pinchStartDistance) / Math.max(1, Math.min(state.width, state.height));
          setZoomTarget(state.pinchStartZoom + delta * 1.35);
        }
        event.preventDefault();
        return;
      }

      if (!state.dragging) return;
      const dx = next.x - state.lastPointer.x;
      const dy = next.y - state.lastPointer.y;
      state.velocity.x = clamp(dy * 0.0048, -0.05, 0.05);
      state.velocity.y = clamp(dx * 0.0048, -0.05, 0.05);
      state.lastPointer = next;
      event.preventDefault();
    });

    earthCanvas.addEventListener("pointerup", endPointer);
    earthCanvas.addEventListener("pointercancel", endPointer);
    earthCanvas.addEventListener("lostpointercapture", endPointer);

    function wheelDeltaPixels(event) {
      if (event.deltaMode === 1) return event.deltaY * 16;
      if (event.deltaMode === 2) return event.deltaY * Math.max(1, state.height);
      return event.deltaY;
    }

    window.addEventListener("wheel", (event) => {
      if (!isEarthMode()) return;
      const target = event.target;
      if (target instanceof Element && target.closest("button, a")) return;
      event.preventDefault();
      const zoomDelta = -wheelDeltaPixels(event) * WHEEL_ZOOM_SENSITIVITY;
      setZoomTarget(state.targetZoom + zoomDelta);
    }, { passive: false });

    window.addEventListener("earth-reset-view", resetEarthInteraction);

    function drawSurfaceText(now) {
      surfaceCtx.clearRect(0, 0, state.width, state.height);
      if (!isEarthMode() || document.body.dataset.surfaceMode === "off") return;

      surfaceCtx.textAlign = "left";
      surfaceCtx.textBaseline = "top";
      surfaceCtx.font = "800 13px Courier New, monospace";
      surfaceCtx.shadowColor = "rgba(255, 255, 255, 0.48)";
      surfaceCtx.shadowBlur = 5.5;

      const cursor = { index: Math.floor(now * 0.00064) % sourceWords.length };
      const scaleX = state.maskWidth / state.width;
      const scaleY = state.maskHeight / state.height;
      const stepX = state.width > 900 ? 4 : 5;
      const lineHeight = state.width > 700 ? 21 : 24;

      for (let y = 0; y < state.height; y += lineHeight) {
        const maskY = Math.floor((state.height - 1 - y) * scaleY);
        if (maskY < 0 || maskY >= state.maskHeight) continue;

        let inLand = false;
        let startX = 0;

        for (let x = 0; x <= state.width; x += stepX) {
          const inside = x < state.width;
          let isLand = false;

          if (inside) {
            const maskX = Math.floor(x * scaleX);
            const idx = (maskY * state.maskWidth + maskX) * 4;
            isLand = state.maskPixels[idx] > 128;
          }

          if (isLand && !inLand) {
            inLand = true;
            startX = x;
          } else if ((!isLand || !inside) && inLand) {
            inLand = false;
            const segmentWidth = x - startX;

            if (segmentWidth > 22) {
              const seed = seededUnit(startX, y);
              const row = Math.floor(y / lineHeight);
              if (seed > 0.52 || (row + Math.floor(startX / 58)) % 4 === 0) {
                const maxTextWidth = Math.min(segmentWidth, 76 + seed * 112);
                const text = layoutWords(maxTextWidth, cursor);
                const pulse = Math.sin(now * 0.0027 + seed * 6.283 + row * 0.14);
                const alpha = 0.54 + Math.max(0, pulse) * 0.16;
                const jump = pulse > 0.9 ? -1.1 : pulse * 0.2;
                const xOffset = Math.max(0, (segmentWidth - maxTextWidth) * seededUnit(y, startX + 17));
                surfaceCtx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(3)})`;
                if (text) surfaceCtx.fillText(text, startX + xOffset, y + jump);
              }
            }
          }
        }
      }

      surfaceCtx.shadowBlur = 0;
    }

    function projectGlobe() {
      const centerWorld = new THREE.Vector3();
      earthGroup.getWorldPosition(centerWorld);
      const center = centerWorld.clone().project(camera);
      const cx = (center.x * 0.5 + 0.5) * state.width;
      const cy = (-center.y * 0.5 + 0.5) * state.height;
      const anchors = [
        new THREE.Vector3(1, 0, 0),
        new THREE.Vector3(-1, 0, 0),
        new THREE.Vector3(0, 1, 0),
        new THREE.Vector3(0, -1, 0),
        new THREE.Vector3(0, 0, 1)
      ];
      let radius = 80;

      anchors.forEach((anchor) => {
        const projected = earthGroup.localToWorld(anchor.clone()).project(camera);
        const x = (projected.x * 0.5 + 0.5) * state.width;
        const y = (-projected.y * 0.5 + 0.5) * state.height;
        radius = Math.max(radius, Math.hypot(x - cx, y - cy));
      });

      return { cx, cy, radius };
    }

    function drawArcText(text, cx, cy, radius, startAngle, endAngle, phase) {
      let angle = startAngle + phase;
      let index = 0;
      const maxSteps = text.length * 2;

      while (angle < endAngle && index < maxSteps) {
        const char = text[index % text.length];
        const width = signalCtx.measureText(char).width + 1.6;
        const charAngle = width / radius;
        const drawAngle = angle + charAngle * 0.5;
        const x = cx + Math.cos(drawAngle) * radius;
        const y = cy + Math.sin(drawAngle) * radius;

        signalCtx.save();
        signalCtx.translate(x, y);
        signalCtx.rotate(drawAngle + Math.PI / 2);
        signalCtx.fillText(char, 0, 0);
        signalCtx.restore();

        angle += charAngle;
        index += 1;
      }
    }

    function drawSignalRing(now) {
      signalCtx.clearRect(0, 0, state.width, state.height);
      if (!isEarthMode() || document.body.dataset.signalMode === "off") return;

      const { cx, cy, radius } = projectGlobe();
      const isNarrow = state.width < 560;
      const ringRadius = radius + Math.max(isNarrow ? 18 : 26, radius * (isNarrow ? 0.1 : 0.18));
      const startAngle = -Math.PI * (isNarrow ? 0.78 : 0.86);
      const endAngle = -Math.PI * (isNarrow ? 0.22 : 0.14);
      const phase = (now * 0.00008) % 0.08;

      signalCtx.font = `800 ${isNarrow ? 7.5 : 9}px Courier New, monospace`;
      signalCtx.textAlign = "center";
      signalCtx.textBaseline = "middle";
      signalCtx.fillStyle = "rgba(247, 243, 232, 0.62)";
      signalCtx.shadowColor = "rgba(247, 243, 232, 0.22)";
      signalCtx.shadowBlur = 3;
      drawArcText(orbitalText, cx, cy, ringRadius, startAngle, endAngle, phase);

      signalCtx.shadowBlur = 0;
    }

    function animateEarth(now) {
      requestAnimationFrame(animateEarth);
      const earthVisible = isEarthMode();

      if (earthVisible) {
        if (!state.dragging) {
          state.velocity.x *= 0.95;
          state.velocity.y *= 0.95;
          if (Math.abs(state.velocity.y) < 0.0011) state.velocity.y = 0.0011;
        }

        earthGroup.rotation.x += state.velocity.x;
        earthGroup.rotation.y += state.velocity.y;
        earthGroup.rotation.x = clamp(earthGroup.rotation.x, -0.92, 0.92);
        state.zoom += (state.targetZoom - state.zoom) * 0.14;
        updateCameraForZoom();
      }

      maskGroup.rotation.copy(earthGroup.rotation);
      renderer.render(scene, camera);

      if (earthVisible && document.body.dataset.surfaceMode !== "off") {
        renderer.setRenderTarget(maskTarget);
        renderer.render(maskScene, camera);
        renderer.readRenderTargetPixels(maskTarget, 0, 0, state.maskWidth, state.maskHeight, state.maskPixels);
        renderer.setRenderTarget(null);
      }

      drawSurfaceText(now);
      drawSignalRing(now);
    }

    window.addEventListener("resize", resizeEarth);
    resizeEarth();
    requestAnimationFrame(animateEarth);
  </script>
</body>
</html>
