name: CI

on:
  push:
    branches: [hg113-main, main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover tests -v

  firmware-build:
    name: ESP32-S3 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PlatformIO
        run: python -m pip install "platformio>=6.1,<7"

      - name: Build ESP32-S3 firmware
        run: >-
          platformio run
          -d firmware/esp32c3_gpio0_21_test
          -e esp32s3_gpio0_21_test

