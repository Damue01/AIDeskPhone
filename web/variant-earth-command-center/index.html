<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>控制指挥中心</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #020403;
      --ink: #f7f3e8;
      --muted: rgba(247, 243, 232, 0.66);
      --dim: rgba(247, 243, 232, 0.22);
      --red: #e6423e;
      --red-soft: rgba(230, 66, 62, 0.13);
      --red-line: rgba(230, 66, 62, 0.42);
      --cyan: #7df6e3;
      --cyan-soft: rgba(125, 246, 227, 0.16);
      --cyan-line: rgba(125, 246, 227, 0.48);
      --paper: #f1eddf;
      --surface: rgba(8, 24, 22, 0.78);
      --black-72: rgba(6, 17, 15, 0.72);
      --black-86: rgba(6, 17, 15, 0.86);
      --glass: linear-gradient(145deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.055));
      --glass-strong: linear-gradient(145deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.08));
      --glass-stroke: rgba(255, 255, 255, 0.2);
      --glass-shadow: 0 26px 72px rgba(0, 0, 0, 0.34);
      --ui: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --mono: "JetBrains Mono", "Courier New", monospace;
      --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    body[data-palette="blue"] {
      --bg: #050b17;
      --cyan: #89c7ff;
      --cyan-soft: rgba(137, 199, 255, 0.13);
      --cyan-line: rgba(137, 199, 255, 0.42);
      --red: #ffb86d;
      --red-soft: rgba(255, 184, 109, 0.12);
      --red-line: rgba(255, 184, 109, 0.36);
      --surface: rgba(7, 17, 34, 0.9);
      --black-72: rgba(5, 11, 23, 0.72);
      --black-86: rgba(5, 11, 23, 0.88);
    }

    body[data-palette="amber"] {
      --bg: #120b05;
      --cyan: #ffbf68;
      --cyan-soft: rgba(255, 191, 104, 0.13);
      --cyan-line: rgba(255, 191, 104, 0.42);
      --red: #7df6e3;
      --red-soft: rgba(125, 246, 227, 0.1);
      --red-line: rgba(125, 246, 227, 0.34);
      --surface: rgba(28, 16, 8, 0.9);
      --black-72: rgba(18, 11, 5, 0.72);
      --black-86: rgba(18, 11, 5, 0.88);
    }

    body[data-palette="red"] {
      --bg: #120305;
      --cyan: #ff5151;
      --cyan-soft: rgba(255, 81, 81, 0.13);
      --cyan-line: rgba(255, 81, 81, 0.44);
      --red: #ffd06f;
      --red-soft: rgba(255, 208, 111, 0.1);
      --red-line: rgba(255, 208, 111, 0.34);
      --surface: rgba(30, 5, 8, 0.9);
      --black-72: rgba(18, 3, 5, 0.72);
      --black-86: rgba(18, 3, 5, 0.88);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-width: 320px;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--ui);
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #020403;
      isolation: isolate;
      cursor: grab;
      touch-action: none;
    }

    #starfield {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 24%, rgba(26, 70, 124, 0.18), transparent 30%),
        radial-gradient(circle at 82% 18%, rgba(62, 118, 169, 0.12), transparent 34%),
        radial-gradient(circle at 52% 70%, rgba(18, 52, 79, 0.18), transparent 44%),
        linear-gradient(180deg, #050913 0%, #010309 64%, #000103 100%);
      opacity: 1;
    }

    #starfield::before,
    #starfield::after {
      content: "";
      position: absolute;
      inset: -12%;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 18% 58%, rgba(61, 122, 192, 0.12), transparent 42%),
        radial-gradient(ellipse at 72% 38%, rgba(80, 190, 226, 0.08), transparent 48%);
      opacity: 0.66;
      animation: starDrift 52s linear infinite;
    }

    #starfield::after {
      inset: -20%;
      opacity: 0.24;
      transform: scale(1.25);
      animation-duration: 86s;
      animation-direction: reverse;
    }

    @keyframes starDrift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-18px, 14px, 0); }
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 6;
      opacity: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 42% 48%, rgba(247, 243, 232, 0.02), transparent 18%),
        radial-gradient(circle at 42% 48%, transparent 0 28%, rgba(2, 4, 3, 0.58) 68%, rgba(2, 4, 3, 0.96) 100%);
      backdrop-filter: blur(0) saturate(1);
      -webkit-backdrop-filter: blur(0) saturate(1);
      transition: opacity 420ms ease, backdrop-filter 420ms ease, -webkit-backdrop-filter 420ms ease;
    }

    .stage[data-dragging="true"] {
      cursor: grabbing;
    }

    .stage[data-mode="map"] {
      cursor: default;
      touch-action: auto;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      display: none;
      background:
        linear-gradient(180deg, rgba(125, 246, 227, 0.07), transparent 20%, transparent 80%, rgba(230, 66, 62, 0.08)),
        repeating-linear-gradient(180deg, transparent 0, transparent 3px, rgba(255, 255, 255, 0.025) 4px);
      mix-blend-mode: screen;
      opacity: 0.42;
    }

    #starfield,
    #globe-canvas,
    #map,
    #map-label-layer,
    #text-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #map {
      z-index: 0;
      opacity: 1;
      visibility: visible;
      background: #020403;
      transform: scale(1.018);
      transform-origin: center;
      transition: opacity 820ms ease, visibility 820ms ease, filter 820ms ease, transform 820ms ease;
    }

    body[data-view-mode="globe"] #map {
      opacity: 0;
      visibility: hidden;
    }

    .stage[data-mode="map"] #map {
      opacity: 1;
      visibility: visible;
      filter: saturate(0.92) contrast(1.02) brightness(0.92);
      transform: scale(1);
    }

    #globe-canvas {
      z-index: 1;
    }

    #map.is-visible {
      opacity: 1;
      visibility: visible;
      filter: saturate(0.92) contrast(1.02) brightness(0.92);
      transform: scale(1);
    }

    body[data-handoff="map"] .stage[data-mode="map"] #map {
      opacity: 0.82;
      filter: saturate(0.88) contrast(0.98) brightness(0.84);
    }

    body[data-handoff="map"] #map.is-visible {
      opacity: 0.82;
      filter: saturate(0.88) contrast(0.98) brightness(0.84);
    }

    .maplibregl-canvas {
      outline: 0;
    }

    .maplibregl-map,
    .maplibregl-canvas-container,
    .maplibregl-canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .maplibregl-ctrl-bottom-left,
    .maplibregl-ctrl-bottom-right {
      display: none;
    }

    .maplibregl-ctrl-top-right {
      top: 94px;
      right: 16px;
    }

    .maplibregl-ctrl-group {
      overflow: hidden;
      border: 1px solid var(--glass-stroke);
      border-radius: 20px;
      background: var(--glass);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(24px) saturate(1.32);
      -webkit-backdrop-filter: blur(24px) saturate(1.32);
    }

    .maplibregl-ctrl button {
      width: 36px;
      height: 36px;
      border: 0;
      filter: invert(1) opacity(0.86);
    }

    .maplibregl-ctrl-group button + button {
      border-top: 0;
    }

    .maplibregl-ctrl button:not(:disabled):hover {
      background: rgba(255, 255, 255, 0.16);
    }

    #map-label-layer {
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 520ms ease, visibility 520ms ease;
    }

    body[data-view-mode="map"] #map-label-layer {
      opacity: 1;
      visibility: visible;
    }

    #text-canvas {
      pointer-events: none;
      z-index: 2;
      mix-blend-mode: screen;
    }

    #globe-canvas,
    #text-canvas,
    .topbar,
    .right-stack,
    .bottom-ticker,
    .mobile-dock {
      transition: opacity 420ms ease, filter 420ms ease, transform 420ms ease;
    }

    body[data-handoff="map"] .stage::before {
      opacity: 1;
      backdrop-filter: blur(10px) saturate(1.05);
      -webkit-backdrop-filter: blur(10px) saturate(1.05);
    }

    body[data-view-mode="map"] .stage::before {
      opacity: 1;
      background:
        linear-gradient(180deg, rgba(2, 4, 3, 0.48) 0%, rgba(2, 4, 3, 0.2) 18%, transparent 38%),
        linear-gradient(0deg, rgba(2, 4, 3, 0.5) 0%, rgba(2, 4, 3, 0.18) 16%, transparent 34%),
        linear-gradient(90deg, rgba(2, 4, 3, 0.18) 0%, transparent 24%, transparent 100%);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    body[data-handoff="map"] #globe-canvas,
    body[data-handoff="map"] #text-canvas {
      opacity: 0.82;
      filter: blur(0) saturate(0.92);
      transform: scale(1.065);
    }

    body[data-view-mode="map"] #globe-canvas,
    body[data-view-mode="map"] #text-canvas {
      opacity: 0;
      visibility: hidden;
    }

    body[data-view-mode="map"][data-handoff="map"] #globe-canvas {
      opacity: 0.36;
      visibility: visible;
      filter: blur(2px) saturate(0.82) brightness(0.72);
      transform: scale(1.095);
    }

    body[data-view-mode="map"][data-handoff="map"] #text-canvas {
      opacity: 0.18;
      visibility: visible;
      filter: blur(1px);
      transform: scale(1.08);
    }

    body[data-view-mode="map"] .right-stack {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    body[data-view-mode="map"] .bottom-ticker {
      background: linear-gradient(145deg, rgba(8, 16, 15, 0.78), rgba(8, 16, 15, 0.48));
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    body[data-handoff="map"] .topbar,
    body[data-handoff="map"] .right-stack,
    body[data-handoff="map"] .bottom-ticker,
    body[data-handoff="map"] .mobile-dock {
      opacity: 0;
      filter: blur(6px);
      transform: translateY(8px);
    }

    .stage[data-handoff="map"] {
      cursor: progress;
    }

    .scanline {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 2px;
      z-index: 5;
      background: rgba(125, 246, 227, 0.34);
      box-shadow: 0 0 18px rgba(125, 246, 227, 0.22);
      animation: scan 5.5s linear infinite;
      pointer-events: none;
    }

    @keyframes scan {
      from { transform: translateY(-3vh); }
      to { transform: translateY(103vh); }
    }

    .topbar {
      position: absolute;
      z-index: 7;
      top: 16px;
      left: 16px;
      right: 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 24px;
      pointer-events: none;
    }

    .brand-block {
      pointer-events: auto;
      width: min(620px, 100%);
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 0;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(29px, 3vw, 54px);
      line-height: 0.9;
      font-weight: 900;
      text-transform: none;
      letter-spacing: 0;
      overflow-wrap: anywhere;
      text-shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
    }

    .right-stack {
      position: relative;
      z-index: 7;
      width: max-content;
      max-width: none;
      border: 0;
      pointer-events: none;
      text-align: right;
      justify-self: end;
      align-self: start;
    }

    .status-block {
      position: relative;
      min-height: 0;
      padding: 0;
      width: max-content;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: rgba(247, 243, 232, 0.94);
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      overflow: visible;
    }

    .status-label {
      position: relative;
      z-index: 1;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 700;
      text-transform: none;
      color: rgba(247, 243, 232, 0.72);
    }

    .status-huge {
      position: relative;
      z-index: 1;
      display: inline-block;
      font-family: var(--display);
      font-size: clamp(30px, 3.4vw, 52px);
      line-height: 0.94;
      font-weight: 900;
      text-transform: none;
      letter-spacing: 0;
      white-space: nowrap;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.78), 0 0 16px rgba(125, 246, 227, 0.1);
    }

    #sector-word {
      font-size: clamp(30px, 3.15vw, 46px);
      line-height: 0.96;
    }

    .status-value {
      position: relative;
      z-index: 1;
      font-size: 19px;
      line-height: 1.25;
      font-weight: 720;
      text-transform: none;
      color: rgba(247, 243, 232, 0.88);
    }

    .status-subline {
      position: relative;
      z-index: 1;
      margin-top: 9px;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 720;
      color: rgba(247, 243, 232, 0.66);
    }

    .status-value-muted {
      margin-top: 4px;
      color: rgba(247, 243, 232, 0.56);
      font-size: 12px;
      font-weight: 680;
    }

    .bottom-ticker {
      position: absolute;
      z-index: 7;
      left: 16px;
      right: 16px;
      bottom: 16px;
      height: 56px;
      display: flex;
      align-items: center;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: linear-gradient(90deg, rgba(176, 14, 20, 0.96) 0 132px, rgba(4, 7, 10, 0.76) 132px 100%);
      color: #f7f3e8;
      pointer-events: auto;
      box-shadow: 0 -18px 50px rgba(0, 0, 0, 0.32);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .bottom-ticker::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), transparent 46%);
      opacity: 0.36;
      pointer-events: none;
    }

    .ticker-label {
      position: relative;
      z-index: 1;
      align-self: stretch;
      display: grid;
      place-items: center;
      gap: 0;
      width: 132px;
      flex: 0 0 132px;
      margin-left: 0;
      padding: 0 0 4px;
      border-radius: 0;
      background: transparent;
      color: rgba(247, 243, 232, 0.92);
      font-size: 22px;
      line-height: 1;
      font-weight: 940;
      letter-spacing: 0;
      text-transform: none;
      text-align: center;
      text-shadow: 0 8px 22px rgba(0, 0, 0, 0.72);
    }

    .ticker-label::before {
      display: none;
    }

    .ticker-window {
      position: relative;
      z-index: 1;
      overflow: hidden;
      min-width: 0;
      height: 100%;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      white-space: nowrap;
      background: transparent;
      border-left: 0;
    }

    .ticker-window::before,
    .ticker-window::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      z-index: 2;
      width: 64px;
      pointer-events: none;
    }

    .ticker-window::before {
      left: 0;
      background: linear-gradient(90deg, rgba(8, 16, 15, 0.92) 0%, transparent 100%);
    }

    .ticker-window::after {
      right: 0;
      background: linear-gradient(270deg, rgba(8, 16, 15, 0.92) 0%, transparent 100%);
    }

    .ticker-track {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      padding-left: 0;
      font-size: 15px;
      font-weight: 720;
      letter-spacing: 0;
      text-transform: none;
      color: rgba(247, 243, 232, 0.88);
      text-shadow: 0 8px 24px rgba(0, 0, 0, 0.68);
      transform: translate3d(100%, 0, 0);
      will-change: transform;
    }

    .log-entry {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-right: 24px;
    }

    .log-keyword {
      color: #fff7d6;
      font-weight: 940;
      text-shadow: 0 0 16px rgba(255, 208, 111, 0.34), 0 8px 22px rgba(0, 0, 0, 0.72);
    }

    .log-separator {
      color: rgba(247, 243, 232, 0.34);
      font-weight: 520;
    }

    body[data-view-mode="map"] .bottom-ticker {
      background: linear-gradient(90deg, rgba(176, 14, 20, 0.96) 0 118px, rgba(4, 7, 10, 0.78) 118px 100%);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    @keyframes tickerPulse {
      0%,
      100% {
        transform: scale(0.86);
        opacity: 0.72;
      }

      50% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .mobile-dock {
      display: none;
    }

    @media (max-width: 1100px) {
      .right-stack {
        width: max-content;
      }

    }

    @media (max-width: 860px) {
      .topbar {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
      }

      .right-stack {
        max-width: none;
      }

      .status-huge {
        font-size: clamp(23px, 6.4vw, 34px);
      }

      .bottom-ticker {
        left: 12px;
        right: 12px;
        bottom: 12px;
      }

      .ticker-label {
        width: 118px;
        flex-basis: 118px;
        font-size: 20px;
      }
    }

    @media (max-width: 560px) {
      .brand-block {
        padding: 0;
      }

      .mobile-dock {
        position: absolute;
        z-index: 7;
        left: 12px;
        right: auto;
        bottom: 70px;
        width: min(366px, calc(100vw - 24px));
        max-width: min(366px, calc(100vw - 24px));
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        padding: 8px;
        border: 1px solid var(--glass-stroke);
        border-radius: 24px;
        background: var(--glass);
        box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(28px) saturate(1.35);
        -webkit-backdrop-filter: blur(28px) saturate(1.35);
        pointer-events: auto;
      }

      .mobile-dock button {
        min-width: 0;
        width: 100%;
        height: 38px;
        padding: 0 4px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(247, 243, 232, 0.86);
        font-size: 11px;
        font-weight: 700;
        text-transform: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mobile-dock a {
        min-width: 0;
        width: 100%;
        height: 38px;
        display: grid;
        place-items: center;
        padding: 0 4px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(247, 243, 232, 0.86);
        font-size: 11px;
        font-weight: 700;
        text-decoration: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mobile-dock button[aria-pressed="true"] {
        border-color: rgba(125, 246, 227, 0.34);
        background: rgba(125, 246, 227, 0.2);
        color: rgba(247, 243, 232, 0.98);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .scanline {
        animation: none;
      }
    }
  </style>
</head>
<body data-palette="teal">
  <main class="stage" id="stage" aria-label="控制指挥中心">
    <div id="starfield" aria-hidden="true"></div>
    <div id="map" aria-label="真实地图"></div>
    <div id="map-label-layer" aria-hidden="true"></div>
    <canvas id="globe-canvas"></canvas>
    <canvas id="text-canvas"></canvas>

    <header class="topbar">
      <section class="brand-block" aria-label="系统身份">
        <div class="brand-row">
          <h1>控制指挥中心</h1>
        </div>
      </section>

      <section class="right-stack" aria-label="当前状态">
        <article class="status-block agent-status">
          <div class="status-huge" id="status-word">等待命令中</div>
        </article>
      </section>
    </header>

    <nav class="mobile-dock" aria-label="移动端控制">
      <button id="m-pause" type="button" aria-pressed="false">暂停</button>
      <button id="m-data" type="button" aria-pressed="false">云图</button>
      <button id="m-map" type="button" aria-pressed="false">地图</button>
      <button id="m-reset" type="button">复位</button>
    </nav>

    <footer class="bottom-ticker" aria-label="控制台日志">

    function lngDistance(a, b) {
      return Math.abs(((a - b + 540) % 360) - 180);
    }

    function nearestCity(center) {
      return nearestCityMatch(center).city;
    }

    function nearestCityMatch(center) {
      return mapCities.reduce((best, city) => {
        const dx = lngDistance(city.lng, center.lng) * Math.cos(center.lat * Math.PI / 180);
        const dy = city.lat - center.lat;
        const distance = Math.hypot(dx, dy);
        return distance < best.distance ? { city, distance } : best;
      }, { city: mapCities[0], distance: Infinity });
    }

    function normalizePlaceName(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[，,。.\s]+/g, " ");

    function cityTerms(city) {
      return [city.name, city.sub, `${city.name} ${city.sub}`].map(normalizePlaceName);
    }

    function findCityByName(query) {
      const normalized = normalizePlaceName(query);
      if (!normalized) return null;

      const exact = mapCities.find(city => cityTerms(city).some(term => term === normalized));
      if (exact) return exact;

      return mapCities.find(city => cityTerms(city).some((term) => {
        if (!term) return false;
        return normalized.includes(term) || term.includes(normalized);
      })) || null;
    }

    function appendConsoleLog(message) {
      const text = String(message || "").trim();
      if (!text) return;
      state.console.logs.push(text);
      state.console.logs = state.console.logs.slice(-18);
      if (state.console.tickerReady) appendConsoleTickerNode(text);
    }

    function renderHighlightedLog(text) {
      const fragment = document.createDocumentFragment();
      const pattern = new RegExp(`(${LOG_KEYWORDS.map(word => word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})`, "g");
      let lastIndex = 0;
      String(text).replace(pattern, (match, _word, offset) => {
        if (offset > lastIndex) fragment.append(document.createTextNode(text.slice(lastIndex, offset)));
        const mark = document.createElement("span");
        mark.className = "log-keyword";
        mark.textContent = match;
        fragment.append(mark);
        lastIndex = offset + match.length;
        return match;
      });
      if (lastIndex < text.length) fragment.append(document.createTextNode(text.slice(lastIndex)));
      return fragment;
    }

    function createConsoleLogNode(entry) {
      const item = document.createElement("span");
      item.className = "log-entry";
      item.append(renderHighlightedLog(entry));
      const separator = document.createElement("span");
      separator.className = "log-separator";
      separator.textContent = "/";
      item.append(separator);
      return item;
    }

    function appendConsoleTickerNode(entry) {
      if (!els.tickerTrack) return;
      els.tickerTrack.append(createConsoleLogNode(entry));
    }

    function consoleTickerNodeWidth(node) {
      if (!node) return 0;
      const style = window.getComputedStyle(node);
      const marginLeft = Number.parseFloat(style.marginLeft) || 0;
      const marginRight = Number.parseFloat(style.marginRight) || 0;
      return node.getBoundingClientRect().width + marginLeft + marginRight;
    }

    function updateConsoleTickerTransform() {
      if (!els.tickerTrack) return;
      els.tickerTrack.style.transform = `translate3d(${state.console.tickerOffset.toFixed(2)}px, 0, 0)`;
    }

    function renderConsoleTicker() {
      if (els.tickerLabel) els.tickerLabel.textContent = "播报";
      if (!els.tickerTrack) return;
      els.tickerTrack.replaceChildren();
      state.console.logs.forEach(entry => appendConsoleTickerNode(entry));
      const tickerWindow = els.tickerTrack.parentElement;
      const startOffset = (tickerWindow ? tickerWindow.clientWidth : state.width) + 24;
      state.console.tickerOffset = startOffset;
      state.console.tickerLastTime = performance.now();
      state.console.tickerReady = true;
      updateConsoleTickerTransform();
    }

    function advanceConsoleTicker(now) {
      if (!els.tickerTrack || !state.console.tickerReady) return;
      const elapsed = clamp(now - state.console.tickerLastTime, 0, 80);
      state.console.tickerLastTime = now;
      state.console.tickerOffset -= (elapsed * state.console.tickerSpeed) / 1000;

      let firstEntry = els.tickerTrack.firstElementChild;
      while (firstEntry) {
        const entryWidth = consoleTickerNodeWidth(firstEntry);
        if (state.console.tickerOffset + entryWidth > -80) break;
        firstEntry.remove();
        state.console.tickerOffset += entryWidth;
        firstEntry = els.tickerTrack.firstElementChild;
      }

      if (!els.tickerTrack.firstElementChild) {
        const tickerWindow = els.tickerTrack.parentElement;
        state.console.tickerOffset = (tickerWindow ? tickerWindow.clientWidth : state.width) + 24;
      }

      updateConsoleTickerTransform();
    }

    function setConsolePhase(key, fromExternal = false) {
      const phase = COMMAND_PHASES.find(item => item.key === key);
      if (!phase) {
        appendConsoleLog(`[SYS] 未知状态 ${String(key || "").trim() || "empty"}`);
        return {
          ok: false,
          action: "setPhase",
          reason: "unknown-phase",
          phases: COMMAND_PHASES.map(item => item.key)
        };
      }

      const previousPhase = state.console.phase;
      state.console.phase = phase.key;
      state.console.phaseIndex = Math.max(0, COMMAND_PHASES.findIndex(item => item.key === phase.key));
      if (fromExternal) state.console.externalUntil = Date.now() + 30000;
      if (previousPhase !== phase.key) appendConsoleLog(phase.log);
      return {
        ok: true,
        action: "setPhase",
        phase: phase.key,
        status: phase.status,
        sector: phase.sector,
        area: phase.area
      };
    }

      const text = String(value || "").replace(/\s+/g, " ").trim();

    function deriveTelemetryPhase() {
      const sample = state.telemetry.sample || {};
      const voice = state.telemetry.voice || {};
      const reply = state.telemetry.reply || {};

      if (reply.playback_active) return "reporting";
      if (voice.recording) return "listening";
      if (voice.processing || voice.streaming_asr) return "executing";
      if ((Number(reply.queue_size) || 0) > 0 || reply.pending_report_text || state.telemetry.alerting) return "feedback";
      if (sample.python_state === "RELEASED") return "listening";
      return "waiting";
    }

    function applyTelemetryPhase() {
      const phase = deriveTelemetryPhase();
      if (phase !== state.telemetry.lastPhase) {
        state.telemetry.lastPhase = phase;
        setConsolePhase(phase, true);
      }
    }

    function applyCommandCenterCommand(payload = {}) {
      const command = payload.command || payload;
      const action = command.action || command.command || "";
      if (!action) return { ok: false, reason: "missing-action" };

      const result = runConsoleCommand(action, command.payload, command.options || {});
      dispatchConsoleResult(command.requestId || command.id, action, result);
      if (result && result.ok) {
        appendConsoleLog(`[AGENT] ${command.skill || "skill"} -> ${action}`);
      } else {
        appendConsoleLog(`[AGENT] ${action || "command"} 执行失败`);
      }
      return result;
    }

    function applyTelemetryPayload(payload = {}) {
      state.telemetry.lastEventAt = Date.now();
      setTelemetryConnection(true);

      if (payload.type === "snapshot") {
        if (payload.current_sample) state.telemetry.sample = payload.current_sample;
        state.telemetry.voice = {...state.telemetry.voice, ...payload};
        state.telemetry.reply = {...state.telemetry.reply, ...payload};
        if (payload.agent) state.telemetry.agent = {...state.telemetry.agent, ...payload.agent};
        state.telemetry.alerting = Boolean(payload.alerting || (payload.current_sample || {}).alerting);
        state.telemetry.alertPhase = payload.alert_phase || (payload.current_sample || {}).alert_phase || "";
      } else if (payload.type === "sample") {
        state.telemetry.sample = payload.sample || {};
        state.telemetry.alerting = Boolean((payload.sample || {}).alerting);
        state.telemetry.alertPhase = (payload.sample || {}).alert_phase || "";
      } else if (payload.type === "voice_status") {
        state.telemetry.voice = {...state.telemetry.voice, ...payload};
        const voiceText = shortText(payload.partial_text || payload.last_result || "");
        if (voiceText && voiceText !== state.telemetry.lastVoiceText) state.telemetry.lastVoiceText = voiceText;
      } else if (payload.type === "reply_status") {
        state.telemetry.reply = {...state.telemetry.reply, ...payload};
        const text = shortText(payload.pending_report_text || replyText(payload.active_reply) || "");
        if (text && text !== state.telemetry.lastReplyText) state.telemetry.lastReplyText = text;
      } else if (payload.type === "agent_status") {
        state.telemetry.agent = {...state.telemetry.agent, ...payload};
      } else if (payload.type === "command_center_command") {
        applyCommandCenterCommand(payload);
        return;
      } else if (payload.type === "alert_status") {
        state.telemetry.alerting = Boolean(payload.alerting);
        state.telemetry.alertPhase = payload.alert_phase || "";
      } else if (payload.type === "action_log" && payload.text) {
        state.telemetry.actionLog = payload.text;
      }

      applyTelemetryPhase();
    }

      if (!("EventSource" in window)) {

        return null;

      const endpoint = controlConsoleUrl("/events");
      state.telemetry.endpoint = endpoint;
      const events = new EventSource(endpoint);

      events.onopen = () => setTelemetryConnection(true);
      events.onerror = () => {
        state.telemetry.lastErrorAt = Date.now();
        setTelemetryConnection(false, "等待 8765/events");
      };
      events.onmessage = (event) => {
        try {
          applyTelemetryPayload(JSON.parse(event.data));
        } catch (error) {
          appendConsoleLog(`[LINK] 事件解析失败：${error.message}`);
        }
      };

      return events;

          const x = Math.random() * canvas.width;
          const wave = Math.sin((x / canvas.width) * Math.PI * 4 + beltIndex) * belt.spread * 0.36;
          const y = (belt.y + wave + (Math.random() - 0.5) * belt.spread) * canvas.height;
          const rx = 34 + Math.random() * 76;
          const ry = 8 + Math.random() * 28;
          cloudCtx.save();
          cloudCtx.translate(x, y);
          cloudCtx.rotate((Math.random() - 0.5) * 0.9);
          cloudCtx.scale(1, ry / rx);
          const gradient = cloudCtx.createRadialGradient(0, 0, 0, 0, 0, rx);
          gradient.addColorStop(0, `rgba(255,255,255,${belt.alpha + Math.random() * 0.18})`);
          gradient.addColorStop(0.62, `rgba(255,255,255,${belt.alpha * 0.58})`);

          cloudCtx.fillStyle = gradient;
          cloudCtx.beginPath();
          cloudCtx.arc(0, 0, rx, 0, Math.PI * 2);
          cloudCtx.fill();
          cloudCtx.restore();
        }
      });

      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;

      return texture;
    }

    function makeAtmosphereGlowTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 512;
      const glowCtx = canvas.getContext("2d");
      const imageData = glowCtx.createImageData(canvas.width, canvas.height);
      const smooth = (edge0, edge1, value) => {
        const t = Math.min(1, Math.max(0, (value - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
      };

      for (let y = 0; y < canvas.height; y += 1) {
        for (let x = 0; x < canvas.width; x += 1) {
          const nx = (x / (canvas.width - 1)) * 2 - 1;
          const ny = (y / (canvas.height - 1)) * 2 - 1;
          const radius = Math.sqrt(nx * nx + ny * ny);
          const innerLift = smooth(0.84, 0.9, radius);
          const outerFade = 1 - smooth(0.93, 0.996, radius);
          const daySide = smooth(0.02, -0.78, nx + ny * 0.04);
          const upperTaper = 0.58 + smooth(-0.86, -0.08, ny) * 0.42;
          const haze = Math.pow(Math.max(0, innerLift * outerFade), 1.06) * (0.006 + daySide * 1.28) * upperTaper;
          const offset = (y * canvas.width + x) * 4;
          imageData.data[offset] = 255;
          imageData.data[offset + 1] = 255;
          imageData.data[offset + 2] = 255;
          imageData.data[offset + 3] = Math.round(haze * 238);
        }
      }

      glowCtx.putImageData(imageData, 0, 0);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;
      return texture;
    }

          vec3 nightColor = texture2D(nightMap, vUv).rgb * uNightExposure;
          vec3 color = mix(nightColor, dayColor, dayMix);
          float directDay = smoothstep(0.02, 0.62, sunAmount);
          color = mix(color, dayColor * 1.06, directDay * 0.12);

          vec3 packed = texture2D(specularCloudsMap, vUv).rgb;
          float oceanMask = smoothstep(0.34, 0.74, packed.r) * (1.0 - smoothstep(0.18, 0.62, packed.g));
          float cloudMask = smoothstep(0.44, 0.92, packed.g) * smoothstep(0.08, 0.9, packed.r);
          float cloudLight = cloudMask * smoothstep(-0.06, 0.7, sunAmount) * uCloudStrength;
          color = mix(color, vec3(1.0), clamp(cloudLight, 0.0, 0.18));

          vec3 reflection = reflect(-lightDirection, normal);
          float specular = pow(max(dot(reflection, viewDirection), 0.0), 72.0);
          specular *= oceanMask * smoothstep(0.12, 0.84, sunAmount) * uSpecularStrength;

          float fresnel = pow(1.0 - max(dot(normal, viewDirection), 0.0), 2.0);
          float atmosphereDayMix = smoothstep(-0.12, 0.86, sunAmount);
          vec3 atmosphere = atmosphereColor * (0.58 + atmosphereDayMix * 0.5);

          float visibleSunLimb = pow(fresnel, 0.72) * smoothstep(-0.1, 0.72, sunAmount);

          color += mix(vec3(1.0), atmosphereColor, 0.64) * specular;

          color *= mix(0.5, 1.0, dayMix + nightMix * 0.24);
          gl_FragColor = vec4(color, 1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }
      `

    function updateGlobeFrame() {
      const aspect = state.width / state.height;
      const desktop = state.width > 860;
      let baseZ = desktop ? 3.32 : 3.82;

      if (aspect < 1.05) baseZ = 4.14;
      if (aspect > 2.05) baseZ = 3.16;

      const shift = desktop ? -clamp((aspect - 1.18) * 0.28, 0.1, 0.42) : 0;
      const verticalShift = desktop ? CAMERA_VERTICAL_FRAME_SHIFT : 0;
      const cameraZ = baseZ / state.globeScale;
      const cameraY = verticalShift + Math.tan(CAMERA_NORTHERN_VIEW_LAT) * cameraZ;
      camera.position.set(0, cameraY, cameraZ);
      camera.lookAt(0, verticalShift, 0);

      earthGroup.position.set(shift, verticalShift, 0);
      maskGroup.position.set(shift, verticalShift, 0);
      outerGlow.position.set(shift, verticalShift, 0);
    }

      renderer.setPixelRatio(state.dpr);
      renderer.setSize(state.width, state.height, false);
      starMaterial.uniforms.uPixelRatio.value = state.dpr;
      camera.aspect = state.width / state.height;
      camera.updateProjectionMatrix();
      updateGlobeFrame();

      textCanvas.width = Math.floor(state.width * state.dpr);
      textCanvas.height = Math.floor(state.height * state.dpr);

      textCanvas.style.height = `${state.height}px`;
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

      const maxMaskSide = state.width > 1000 ? 320 : 256;
      const scale = maxMaskSide / Math.max(state.width, state.height);
      state.maskWidth = Math.max(96, Math.floor(state.width * scale));
      state.maskHeight = Math.max(96, Math.floor(state.height * scale));
      maskTarget.setSize(state.maskWidth, state.maskHeight);
      state.maskPixels = new Uint8Array(state.maskWidth * state.maskHeight * 4);
    }

    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

    function markGlobeInteraction(now = performance.now()) {

      state.recentering = false;

    function dampValue(current, target, amount) {
      return current + (target - current) * amount;
    }

    function dampAngle(current, target, amount) {
      const delta = THREE.MathUtils.euclideanModulo(target - current + Math.PI, Math.PI * 2) - Math.PI;
      return current + delta * amount;
    }

    function restoreDefaultSpinPosture() {
      earthGroup.rotation.x = dampAngle(earthGroup.rotation.x, EARTH_DEFAULT_ROTATION.x, EARTH_IDLE_RECENTER_EASE);
      earthGroup.rotation.y = dampAngle(earthGroup.rotation.y, 0, EARTH_IDLE_RECENTER_EASE);
      earthGroup.rotation.z = dampAngle(earthGroup.rotation.z, EARTH_DEFAULT_ROTATION.z, EARTH_IDLE_RECENTER_EASE);
      state.velocity.x = dampValue(state.velocity.x, 0, 0.12);
      state.velocity.y = dampValue(state.velocity.y, EARTH_AUTOROTATE_VELOCITY, 0.045);
      state.recentering = true;
    }

    function lngLatFromUv(uv) {
      const rawLng = uv.x * 360 - 180;
      const lng = ((rawLng + 540) % 360) - 180;
      const lat = uv.y * 180 - 90;
      return [
        Number(lng.toFixed(4)),
        Number(clamp(lat, -82, 82).toFixed(4))
      ];
    }

    function setGlobeScaleTarget(value, immediate = false) {
      const next = clamp(value, MIN_GLOBE_SCALE, MAX_GLOBE_SCALE);

      if (immediate) {
        state.globeScale = next;

    function wheelDeltaPixels(event) {
      if (event.deltaMode === 1) return event.deltaY * 16;
      if (event.deltaMode === 2) return event.deltaY * Math.max(1, state.height);
      return event.deltaY;
    }

    function pinchDistance() {
      const points = Array.from(state.activePointers.values());
      if (points.length < 2) return 0;
      return Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
    }

    function earthCenterLngLat() {
      camera.updateMatrixWorld();
      earthMesh.updateWorldMatrix(true, false);
      const centerWorld = new THREE.Vector3();
      earthGroup.getWorldPosition(centerWorld);
      const projected = centerWorld.clone().project(camera);
      handoffRaycaster.setFromCamera({ x: projected.x, y: projected.y }, camera);
      const hit = handoffRaycaster.intersectObject(earthMesh, false)[0];
      if (!hit || !hit.uv) return [105, 31];
      return lngLatFromUv(hit.uv);
    }

    function earthLngLatAtPoint(point, fallback = true) {
      camera.updateMatrixWorld();
      earthMesh.updateWorldMatrix(true, false);
      const ndc = {
        x: (point.x / Math.max(1, state.width)) * 2 - 1,
        y: -(point.y / Math.max(1, state.height)) * 2 + 1
      };
      handoffRaycaster.setFromCamera(ndc, camera);
      const hit = handoffRaycaster.intersectObject(earthMesh, false)[0];
      if (!hit || !hit.uv) return fallback ? earthCenterLngLat() : null;
      return lngLatFromUv(hit.uv);
    }

    function screenPointHasLand(point) {
      if (!point || !state.maskPixels || !state.maskWidth || !state.maskHeight) return false;
      const maskX = Math.floor(clamp(point.x / Math.max(1, state.width), 0, 0.999) * state.maskWidth);
      const maskY = Math.floor(clamp((state.height - 1 - point.y) / Math.max(1, state.height), 0, 0.999) * state.maskHeight);
      const idx = (maskY * state.maskWidth + maskX) * 4;
      return state.maskPixels[idx] > 128;
    }

    function resolveMapHandoffTarget(target, point) {
      const center = { lng: target[0], lat: target[1] };
      if (point && screenPointHasLand(point)) {

        return target;
      }

      const match = nearestCityMatch(center);
      stage.dataset.handoffSnap = "city";
      stage.dataset.handoffSnapDistance = match.distance.toFixed(2);

        if (finished) return;

        callback();
      };

      if (map.areTilesLoaded && map.areTilesLoaded()) {

      const center = [

      const zoom = target.zoom || MAP_HANDOFF_ZOOM;
      const duration = target.duration || MAP_HANDOFF_EASE_MS;
      const label = target.label || "";

      waitForMapWarmup(() => {
        setViewMode("map");
        map.resize();
        map.easeTo({
          center,

          pitch: 0,
          bearing: 0,
          duration,
          essential: true,
          easing: (t) => 1 - Math.pow(1 - t, 3)
        });
        syncMapDataset();
        window.setTimeout(() => {
          delete document.body.dataset.handoff;
          delete stage.dataset.handoff;
        }, 620);
        window.setTimeout(() => {
          setMapWheelEnabled(true);

    function readNumber(...values) {
      for (const value of values) {
        const number = Number(value);
        if (Number.isFinite(number)) return number;
      }
      return null;
    }

    function normalizeNavigationTarget(input, options = {}) {
      const source = input && typeof input === "object" && !Array.isArray(input) ? input : {};
      const query = typeof input === "string"
        ? input
        : source.city || source.place || source.query || source.name || options.city || options.place || options.query || options.name || "";
      const city = query ? findCityByName(query) : null;
      const centerInput = Array.isArray(input) ? input : source.center || source.lngLat || source.coordinates || options.center || options.lngLat;
      const lng = centerInput ? readNumber(centerInput[0]) : readNumber(source.lng, source.longitude, options.lng, options.longitude, city && city.lng);
      const lat = centerInput ? readNumber(centerInput[1]) : readNumber(source.lat, source.latitude, options.lat, options.latitude, city && city.lat);

      if (!Number.isFinite(lng) || !Number.isFinite(lat)) {
        return {
          ok: false,
          reason: "missing-coordinates",
          query: query || ""
        };
      }

      const minZoom = state.mapReady && map.getMinZoom ? map.getMinZoom() : 5.4;
      const maxZoom = state.mapReady && map.getMaxZoom ? map.getMaxZoom() : 18.8;
      const defaultZoom = city ? 12.35 : 13.4;
      const zoom = clamp(readNumber(source.zoom, options.zoom, defaultZoom), minZoom, maxZoom);
      const duration = clamp(readNumber(source.duration, options.duration, 1480), 420, 4200);
      const label = source.label || options.label || (city && city.name) || query || "指定位置";

      return {
        ok: true,
        center: [

    function navigateToMapTarget(input, options = {}) {
      const target = normalizeNavigationTarget(input, options);
      if (!target.ok) {
        const query = target.query ? ` ${target.query}` : "";
        appendConsoleLog(`[NAV] 未找到目标${query}，请传入城市名或 lng/lat`);
        return target;
      }

      const payload = {
        center: target.center,
        zoom: target.zoom,
        duration: target.duration,
        label: target.label
      };
      state.previousMapZoom = target.zoom;
      state.handoffTargetLngLat = target.center;
      stage.dataset.mapCenter = `${target.center[0]},${target.center[1]}`;
      stage.dataset.mapZoom = target.zoom.toFixed(2);
      stage.dataset.mapTarget = target.label;
      setConsolePhase("executing", true);
      appendConsoleLog(`[NAV] 跳转 ${target.label}`);

      if (!state.mapReady) {
        state.pendingMapTarget = payload;
        return { ...target, pending: true };
      }

      if (document.body.dataset.viewMode !== "map") {
        enterMapAtTarget(payload);
        return { ...target, mode: "handoff" };
      }

      lockMapReturn(target.duration + 1300);
      setMapWheelEnabled(false);
      setMapProjection("mercator");
      map.resize();
      if (map.stop) map.stop();
      map.easeTo({
        center: target.center,
        zoom: target.zoom,
        pitch: 0,
        bearing: 0,
        duration: target.duration,
        essential: true,
        easing: (t) => 1 - Math.pow(1 - t, 3)
      });
      window.setTimeout(() => {
        setMapWheelEnabled(true);
        syncMapDataset();
        updateMapLabels();
      }, target.duration + 120);
      return { ...target, mode: "map" };
    }

        appendConsoleLog(`[NAV] 未找到城市 ${name || ""}`.trim());
        return { ok: false, reason: "unknown-city", query: name || "" };
      }
      return navigateToMapTarget({

        state.mapReturnCharge += Math.min(Math.abs(deltaPixels), MAP_RETURN_WHEEL_STEP_MAX);

          now.getUTCMonth(),

      }
      return dates;

    function hashText(text) {
      let hash = 0;
      for (let i = 0; i < text.length; i += 1) {
        hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
      }
      return Math.abs(hash);
    }

    function resolveServiceArea() {
      const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
      const language = navigator.language || "zh-CN";
      const knownZones = [
        [/^Asia\/Shanghai$/i, "上海服务区"],
        [/^Asia\/Chongqing$/i, "成都服务区"],
        [/^Asia\/Urumqi$/i, "西北服务区"],

        [/^Asia\/Singapore$/i, "新加坡服务区"],
        [/^Asia\/Tokyo$/i, "东京服务区"],

        [/^America\/Los_Angeles$/i, "洛杉矶服务区"],
        [/^America\/New_York$/i, "纽约服务区"]
      ];
      const matched = knownZones.find(([pattern]) => pattern.test(timeZone));
      if (matched) return { area: matched[1], source: "安全定位" };

      const fallbackAreas = ["本地一号服务区", "本地二号服务区", "本地三号服务区", "本地四号服务区"];
      const area = fallbackAreas[hashText(`${timeZone}|${language}`) % fallbackAreas.length];
      return { area, source: "本机安全推断" };
    }

      return {
        ok: true,
        action: "setVisualPreset",
        preset: name,
        label: preset.label,
        available: [...VISUAL_PRESET_ORDER]
      };
    }

    function cycleVisualPresetByStep(step = 1, options = {}) {
      const currentIndex = Math.max(0, VISUAL_PRESET_ORDER.indexOf(state.visualPreset));
      const nextIndex = (currentIndex + step + VISUAL_PRESET_ORDER.length) % VISUAL_PRESET_ORDER.length;
      return applyVisualPreset(VISUAL_PRESET_ORDER[nextIndex], options);
    }

    function getConsoleApiVisualPresets() {
      return VISUAL_PRESET_ORDER.map(key => ({
        key,
        label: VISUAL_PRESETS[key].label
      }));
    }

    function syncControls() {
      document.body.dataset.earthTone = state.earthTone;
      document.body.dataset.dataMode = state.dataMode;
      document.body.dataset.visualPreset = state.visualPreset;
      stage.dataset.visualPreset = state.visualPreset;
      const displayedScale = state.targetGlobeScale || state.globeScale;
      stage.dataset.zoom = displayedScale.toFixed(2);
      setText(els.speedValue, state.speed.toFixed(2));
      setText(els.densityValue, String(state.lineHeight));
      setText(els.alphaValue, state.textAlpha.toFixed(2));
      setText(els.globeScaleValue, displayedScale.toFixed(2));
      setText(els.paletteValue, paletteLabels[state.palette] || "青绿");
      els.paletteButtons.forEach(button => setPressed(button, button.dataset.palette === state.palette));
      setText(els.earthToneValue, earthToneLabels[state.earthTone] || "原色");
      els.earthToneButtons.forEach(button => setPressed(button, button.dataset.earthTone === state.earthTone));
      setText(els.dataModeValue, dataModeLabels[state.dataMode] || "离线底图");
      els.dataModeButtons.forEach(button => setPressed(button, button.dataset.dataMode === state.dataMode));
      setPressed(els.pause, state.paused);
      setPressed(els.mobilePause, state.paused);
      setPressed(els.mobileData, state.dataMode === "live");
      setPressed(els.mobileMap, document.body.dataset.viewMode === "map");
      setPressed(els.wire, state.showWire);
      wireMesh.visible = state.showWire;

    }

    function applyPalette(name) {
      if (!paletteMaterials[name]) return;
      state.palette = name;
      document.body.dataset.palette = name;
      const material = paletteMaterials[name];
      renderer.setClearColor(material.clear, 0);
      wireMaterial.color.setHex(material.wire);
      if (!VISUAL_PRESETS[state.visualPreset]) {
        atmosphereMaterial.uniforms.atmosphereColor.value.setHex(material.atmosphere);
      }
      applyVisualPreset(state.visualPreset, { silent: true });
      applyEarthLighting();
      syncControls();
    }

    function applyEarthLighting() {
      const preset = VISUAL_PRESETS[state.visualPreset] || VISUAL_PRESETS.haze;
      applyFillLightsForPreset(preset);
    }

    function applyEarthTone(name) {
      if (!earthToneLabels[name]) return;
      state.earthTone = name;
      applyEarthLighting();
      syncControls();
    }

    function applyEarthMap(texture) {
      earthMaterial.uniforms.dayMap.value = texture;
      earthMaterial.needsUpdate = true;
    }

    async function loadLiveEarthTexture() {
      if (state.liveTexture) {
        applyEarthMap(state.liveTexture);
        return;
      }

      state.liveLoading = true;
      state.liveError = false;
      syncControls();

      const dates = recentGibsDates();
      for (const date of dates) {
        try {
          const texture = await textureLoader.loadAsync(gibsWmsUrl(GIBS_TRUE_COLOR_LAYER, date));
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
          state.liveTexture = texture;
          state.liveDate = date;
          applyEarthMap(texture);
          state.liveLoading = false;
          syncControls();
          return;
        } catch {
        }
      }

      state.liveLoading = false;
      state.liveError = true;
      state.dataMode = "atlas";
      applyEarthMap(state.satelliteTexture || diffuseMap);
      syncControls();
    }

    async function applyDataMode(name) {
      if (!dataModeLabels[name]) return;
      if (name !== "live") state.liveError = false;
      state.dataMode = name;
      if (name === "live") {
        await loadLiveEarthTexture();
      } else {
        applyEarthMap(state.satelliteTexture || diffuseMap);
      }
      syncControls();
    }

    els.speed?.addEventListener("input", () => {
      state.speed = Number(els.speed.value);
      syncControls();
    });

    els.density?.addEventListener("input", () => {
      state.lineHeight = Number(els.density.value);
      syncControls();
    });

    els.alpha?.addEventListener("input", () => {
      state.textAlpha = Number(els.alpha.value);
      syncControls();
    });

    els.globeScale?.addEventListener("input", () => {
      setGlobeScaleTarget(Number(els.globeScale.value), true);
    });

    els.paletteButtons.forEach(button => {
      button.addEventListener("click", () => applyPalette(button.dataset.palette));
    });

    els.earthToneButtons.forEach(button => {
      button.addEventListener("click", () => applyEarthTone(button.dataset.earthTone));
    });

    els.dataModeButtons.forEach(button => {
      button.addEventListener("click", () => {
        applyDataMode(button.dataset.dataMode);
      });
    });

    els.viewToggle?.addEventListener("click", () => {
      const isOpen = els.viewPanel.classList.toggle("open");
      els.viewToggle.setAttribute("aria-expanded", String(isOpen));
    });

    function togglePause() {
      state.paused = !state.paused;
      syncControls();
    }

    function resetView() {
      state.velocity.x = 0;
      state.velocity.y = EARTH_AUTOROTATE_VELOCITY;
      earthGroup.rotation.set(
        EARTH_DEFAULT_ROTATION.x,
        0,
        EARTH_DEFAULT_ROTATION.z
      );
      earthSpinGroup.rotation.y = EARTH_DEFAULT_ROTATION.y;
      markGlobeInteraction();
      state.zoomAnchorLngLat = null;
      state.zoomAnchorPoint = null;
      state.zoomLockUntil = 0;
      state.globeWheelLockedUntil = 0;
      state.handoffTargetLngLat = null;
      delete stage.dataset.zoomAnchor;
      if (document.body.dataset.viewMode === "map") {
        returnToGlobeView(false);
      } else {
        setGlobeScaleTarget(1, true);
      }
      state.paused = false;
      syncControls();
    }

    els.pause?.addEventListener("click", togglePause);
    els.mobilePause?.addEventListener("click", togglePause);
    els.mobileData?.addEventListener("click", () => {
      applyDataMode(state.dataMode === "live" ? "atlas" : "live");
    });
    els.mobileMap?.addEventListener("click", () => {
      if (document.body.dataset.viewMode === "map") {
        returnToGlobeView(true);
        return;
      }
      triggerRealMapHandoff();
    });
    els.wire?.addEventListener("click", () => {
      state.showWire = !state.showWire;
      syncControls();
    });
    els.reset?.addEventListener("click", resetView);
    els.mobileReset?.addEventListener("click", resetView);

    window.addEventListener("keydown", (event) => {
      if (event.defaultPrevented || event.ctrlKey || event.metaKey || event.altKey) return;
      const target = event.target;
      if (target && target.closest && target.closest("button, input, textarea, select, a")) return;
      if (event.key && event.key.toLowerCase() === "v") {
        cycleVisualPresetByStep(1);
      }
    });

    function pointerPoint(event) {
      const rect = stage.getBoundingClientRect();
      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
    }

    stage.addEventListener("pointerdown", (event) => {
      if (document.body.dataset.viewMode === "map") return;
      if (event.target.closest("button, input, a")) return;
      const point = pointerPoint(event);
      state.activePointers.set(event.pointerId, point);
      state.dragging = state.activePointers.size === 1;
      state.lastPointer = point;
      markGlobeInteraction();
      if (state.activePointers.size === 2) {
        state.dragging = false;
        state.pinchStartDistance = pinchDistance();
        state.pinchStartScale = state.targetGlobeScale;
      }
      stage.dataset.dragging = state.activePointers.size ? "true" : "false";
      stage.setPointerCapture(event.pointerId);
      if (els.drag) els.drag.textContent = "拖拽旋转：锁定";
      event.preventDefault();
    });

    function endPointer(event) {
      state.activePointers.delete(event.pointerId);
      state.dragging = state.activePointers.size === 1;
      state.pinchStartDistance = 0;
      state.pinchStartScale = state.targetGlobeScale;
      if (state.dragging) {
        state.lastPointer = Array.from(state.activePointers.values())[0];
      }
      if (state.activePointers.size === 0) {
        state.dragging = false;
        stage.dataset.dragging = "false";
      }
      if (stage.hasPointerCapture(event.pointerId)) {
        stage.releasePointerCapture(event.pointerId);
      }
      if (els.drag) els.drag.textContent = state.dragging ? "拖拽旋转：锁定" : "拖拽旋转：空闲";
    }

    stage.addEventListener("pointerup", endPointer);
    stage.addEventListener("pointercancel", endPointer);
    stage.addEventListener("lostpointercapture", endPointer);

    stage.addEventListener("pointermove", (event) => {
      if (document.body.dataset.viewMode === "map") return;
      const next = pointerPoint(event);
      if (state.activePointers.has(event.pointerId)) {
        state.activePointers.set(event.pointerId, next);
      }

      if (state.activePointers.size >= 2) {
        markGlobeInteraction();
        const distance = pinchDistance();
        if (state.pinchStartDistance > 0) {
          const delta = (distance - state.pinchStartDistance) / Math.max(1, Math.min(state.width, state.height));
          setGlobeScaleTarget(state.pinchStartScale + delta * 1.18);
        }
        event.preventDefault();
        return;
      }

      if (!state.dragging) return;
      markGlobeInteraction();
      const dx = next.x - state.lastPointer.x;
      const dy = next.y - state.lastPointer.y;
      state.velocity.x = clamp(dy * 0.0048, -0.05, 0.05);
      state.velocity.y = clamp(dx * 0.0048, -0.05, 0.05);
      state.lastPointer = next;
      event.preventDefault();
    });

    stage.addEventListener("wheel", (event) => {
      if (document.body.dataset.viewMode === "map") return;
      if (event.target.closest("button, input, a, .topbar, .right-stack, .bottom-ticker, .mobile-dock")) return;
      event.preventDefault();
      if (performance.now() < state.globeWheelLockedUntil) return;
      if (state.mapHandoffTriggered) return;
      const deltaPixels = wheelDeltaPixels(event);
      const zoomingIn = deltaPixels < 0;
      const wheelPoint = pointerPoint(event);
      const now = performance.now();
      markGlobeInteraction(now);
      const gestureExpired = now > state.zoomLockUntil;
      const anchorMoved = !state.zoomAnchorPoint ||
        Math.hypot(wheelPoint.x - state.zoomAnchorPoint.x, wheelPoint.y - state.zoomAnchorPoint.y) > ZOOM_ANCHOR_MOVE_PX;
      state.zoomLockUntil = now + ZOOM_INTERACTION_IDLE_MS;
      state.velocity.x = 0;
      state.velocity.y = 0;
      let wheelAnchor = null;
      if (zoomingIn) {
        wheelAnchor = earthLngLatAtPoint(wheelPoint, false);
        if (wheelAnchor && (gestureExpired || anchorMoved || !state.zoomAnchorLngLat)) {
          state.zoomAnchorLngLat = wheelAnchor;
          state.zoomAnchorPoint = wheelPoint;
          stage.dataset.zoomAnchor = `${wheelAnchor[0]},${wheelAnchor[1]}`;
        } else if (!wheelAnchor && gestureExpired) {
          state.zoomAnchorLngLat = null;
          state.zoomAnchorPoint = null;
          delete stage.dataset.zoomAnchor;
        }
      }
      const wasAtMax = state.targetGlobeScale >= MAX_GLOBE_SCALE - 0.01;
      const nextScale = state.targetGlobeScale - deltaPixels * WHEEL_ZOOM_SENSITIVITY;

      if (zoomingIn && wasAtMax && nextScale >= MAX_GLOBE_SCALE) {
        if (!wheelAnchor && !state.zoomAnchorLngLat) {
          state.mapHandoffCharge = 0;
          stage.dataset.handoffCharge = "0";
          setGlobeScaleTarget(MAX_GLOBE_SCALE);
          return;
        }
        state.mapHandoffCharge += Math.min(Math.abs(deltaPixels), 92);
        stage.dataset.handoffCharge = String(Math.min(100, Math.round((state.mapHandoffCharge / MAP_HANDOFF_WHEEL_THRESHOLD) * 100)));
        setGlobeScaleTarget(MAX_GLOBE_SCALE);
        if (state.mapHandoffCharge >= MAP_HANDOFF_WHEEL_THRESHOLD) {
          triggerRealMapHandoff(wheelPoint);
        }
        return;
      }

      if (!zoomingIn || nextScale < MAX_GLOBE_SCALE - 0.02) {
        state.mapHandoffCharge = 0;
        stage.dataset.handoffCharge = "0";
        if (!zoomingIn && nextScale < MAX_GLOBE_SCALE - 0.1) {
          state.zoomAnchorLngLat = null;
          state.zoomAnchorPoint = null;
          state.handoffTargetLngLat = null;
          delete stage.dataset.zoomAnchor;
        }
      }

      setGlobeScaleTarget(nextScale);
    }, { passive: false });

    function layoutWords(maxWidth, cursor) {
      const maxChars = Math.max(4, Math.min(20, Math.floor(maxWidth / 6.8)));
      let line = "";
      let used = 0;
      let guard = 0;
      while (guard < 80) {
        const word = sourceWords[cursor.index % sourceWords.length];
        const extra = line ? word.length + 1 : word.length;
        if (line && used + extra > maxChars) break;
        line = line ? `${line} ${word}` : word;
        used += extra;
        cursor.index += 1;
        guard += 1;
        if (used > maxChars * 0.92) break;
      }
      return line;
    }

    function seededUnit(x, y) {
      const value = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
      return value - Math.floor(value);
    }

    function drawSurfaceText(now) {
      ctx.font = "800 10.5px Courier New, monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.shadowColor = "rgba(255, 255, 255, 0.36)";
      ctx.shadowBlur = 3.2;

      const cursor = { index: Math.floor(now * 0.002) % sourceWords.length };
      const scaleX = state.maskWidth / state.width;
      const scaleY = state.maskHeight / state.height;
      const stepX = state.width > 900 ? 4 : 5;

      for (let y = 0; y < state.height; y += state.lineHeight) {
        const maskY = Math.floor((state.height - 1 - y) * scaleY);
        if (maskY < 0 || maskY >= state.maskHeight) continue;

        let inLand = false;
        let startX = 0;

        for (let x = 0; x <= state.width; x += stepX) {
          const inside = x < state.width;
          let isLand = false;
          if (inside) {
            const maskX = Math.floor(x * scaleX);
            const idx = (maskY * state.maskWidth + maskX) * 4;
            isLand = state.maskPixels[idx] > 128;
          }

          if (isLand && !inLand) {
            inLand = true;
            startX = x;
          } else if ((!isLand || !inside) && inLand) {
            inLand = false;
            const segmentWidth = x - startX;
            if (segmentWidth > 24) {
              const seed = seededUnit(startX, y);
              const row = Math.floor(y / Math.max(1, state.lineHeight));
              if (seed > 0.44 || (row + Math.floor(startX / 72)) % 5 === 0) {
                const maxTextWidth = Math.min(segmentWidth, 88 + seed * 104);
                const text = layoutWords(maxTextWidth, cursor);
                const pulse = Math.sin(now * 0.002 + seed * 6.283 + row * 0.18);
                const alpha = Math.min(0.82, state.textAlpha * (0.58 + Math.max(0, pulse) * 0.18));
                const xOffset = Math.max(0, (segmentWidth - maxTextWidth) * seededUnit(y, startX + 17));
                const yOffset = pulse > 0.92 ? -0.8 : 0;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(3)})`;
                if (text) ctx.fillText(text, startX + xOffset, y + yOffset);
              }
            }
          }
        }
      }

      ctx.shadowBlur = 0;
    }

    function updatePanels(now) {
      state.fpsFrames += 1;
      if (now - state.fpsLast > 500) {
        state.fpsValue = Math.round((state.fpsFrames * 1000) / (now - state.fpsLast));
        state.fpsFrames = 0;
        state.fpsLast = now;
      }

      const phase = COMMAND_PHASES.find(item => item.key === state.console.phase) || COMMAND_PHASES[0];

      setText(els.fps, state.fpsValue ? String(state.fpsValue) : "--");
      setText(els.rot, earthSpinGroup.rotation.y.toFixed(2));
      setText(els.mask, state.maskPixels[0] !== undefined ? "运行" : "就绪");
      setText(els.status, state.paused ? "暂停" : phase.status);
    }

    function render(now) {
      requestAnimationFrame(render);

      if (Math.abs(state.targetGlobeScale - state.globeScale) > 0.001) {
        state.globeScale += (state.targetGlobeScale - state.globeScale) * 0.16;
        updateGlobeFrame();
      }

      if (!state.paused) {
        const frameNow = performance.now();
        const zoomInteractionActive = frameNow < state.zoomLockUntil || state.mapHandoffTriggered;
        if (!state.dragging && !zoomInteractionActive) {
          const idleMs = frameNow - state.lastGlobeInteractionAt;
          if (idleMs >= EARTH_IDLE_RECENTER_DELAY_MS) {
            restoreDefaultSpinPosture();
          } else {
            state.velocity.x *= 0.95;
            state.velocity.y *= 0.95;
            const floor = EARTH_AUTOROTATE_VELOCITY * state.speed;
            if (Math.abs(state.velocity.y) < floor) state.velocity.y = floor;
          }
        }
        if (!zoomInteractionActive) {
          earthGroup.rotation.x += state.velocity.x * state.speed;
          earthSpinGroup.rotation.y += state.velocity.y * state.speed;
        }
        cloudMesh.rotation.y -= 0.000104719755 * state.speed;
        starField.rotation.z += 0.000004 * state.speed;
      }

      starMaterial.uniforms.uTime.value = now * 0.001;
      limbFogMaterial.uniforms.uTime.value = now * 0.001;

      earthGroup.rotation.x = clamp(earthGroup.rotation.x, -0.92, 0.92);
      maskGroup.rotation.copy(earthGroup.rotation);
      maskSpinGroup.rotation.y = earthSpinGroup.rotation.y;
      outerGlow.position.copy(earthGroup.position);

      renderer.setRenderTarget(null);
      renderer.render(scene, camera);

      renderer.setRenderTarget(maskTarget);
      renderer.render(maskScene, camera);
      renderer.readRenderTargetPixels(maskTarget, 0, 0, state.maskWidth, state.maskHeight, state.maskPixels);
      renderer.setRenderTarget(null);

      ctx.clearRect(0, 0, state.width, state.height);

      drawSurfaceText(now);
      updatePanels(now);
      advanceConsoleTicker(now);
    }

    window.addEventListener("resize", resize);
    resize();
    applyEarthLighting();
    applyVisualPreset(state.visualPreset, { silent: true });
    syncControls();
    renderConsoleTicker();
    setInterval(advanceConsolePhase, 5200);
    window.setTimeout(applyInitialNavigationFromUrl, 700);
    requestAnimationFrame(render);
  </script>
</body>
</html>
